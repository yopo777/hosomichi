<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<title>細道ルートナビ hosomichi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#map{position:absolute;inset:0}
#panel{position:absolute;top:8px;left:8px;right:8px;max-width:440px;z-index:1000;background:#fff;border-radius:12px;
  box-shadow:0 2px 10px #0004;padding:10px 12px;font-size:15px}
#panel.min .body{display:none}
#head{display:flex;align-items:center;gap:8px;font-weight:bold}
#head .t{flex:1}
#tog{border:none;background:#eee;border-radius:8px;padding:4px 10px;font-size:14px}
#fs{border:none;background:#eee;border-radius:8px;padding:4px 10px;font-size:16px;line-height:1.2;display:none}
.row{display:flex;gap:6px;margin-top:8px;align-items:center}
.row label{width:3.2em;font-size:13px;color:#555}
.row input[type=text]{flex:1;min-width:0;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.ib{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 10px;font-size:15px}
#go{width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px;background:#d93025;color:#fff;font-size:17px;font-weight:bold}
#go:disabled{background:#999}
.pre{display:flex;gap:6px;margin-top:8px}
.pre button{flex:1;padding:8px 4px;border:1px solid #ccc;background:#fff;border-radius:8px;font-size:13px}
.pre button.on{border-color:#d93025;background:#fdecea;color:#d93025;font-weight:bold}
#cfgBox{display:none;margin-top:8px;background:#f7f7f7;border-radius:8px;padding:6px 8px;max-height:45vh;overflow:auto}
#cfgBox h4{margin:8px 0 2px;font-size:12px;color:#d93025}
#cfgBox .c{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
#cfgBox .c span{flex:1}
#cfgBox select{font-size:13px;padding:3px;border-radius:6px;border:1px solid #ccc;max-width:58%}
#cfgBox .note{font-size:11px;color:#888}
#prog{margin-top:8px;display:none}
#bar{height:10px;background:#eee;border-radius:4px;overflow:hidden}
#bar div{height:100%;width:0;background:#d93025;transition:width .4s}
#bar.busy div{width:30%!important;animation:busy 1.2s infinite linear}
@keyframes busy{from{margin-left:-30%}to{margin-left:100%}}
#msg{font-size:12px;color:#555;margin-top:4px;white-space:pre-wrap}
#msg.err{color:#c00}
#result{display:none;margin-top:8px;font-size:13px;line-height:1.5}
#result .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#result .btns button{flex:1}
#list{display:none;max-height:40vh;overflow:auto;margin-top:6px}
#list .it{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px solid #eee;font-size:13px}
#list .it .nm{flex:1;min-width:0;cursor:pointer}
#list .it .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .it .nm small{color:#888}
#list .it button{border:1px solid #ccc;background:#fff;border-radius:6px;padding:4px 8px;font-size:13px}
#share{display:none;margin-top:8px;font-size:13px;background:#f6f6f6;border-radius:8px;padding:8px}
#share textarea{width:100%;height:60px;font-size:11px}
#gps{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));right:12px;z-index:1000;width:60px;height:60px;border-radius:50%;
  border:none;background:#fff;box-shadow:0 2px 8px #0005;font-size:28px;line-height:60px;text-align:center}
#gps.on{background:#1a73e8;color:#fff}
#dir{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom));right:18px;z-index:1000;width:48px;height:48px;border-radius:50%;
  border:none;background:#fff;box-shadow:0 2px 8px #0005;padding:0;display:none}
#dir.on{background:#1a73e8}
#lay{position:absolute;bottom:calc(172px + env(safe-area-inset-bottom));right:18px;z-index:1000;width:48px;height:48px;border-radius:50%;
  border:none;background:#fff;box-shadow:0 2px 8px #0005;font-size:22px;padding:0}
#lay small{position:absolute;right:0;bottom:-16px;font-size:10px;color:#333;text-shadow:0 0 3px #fff;white-space:nowrap}
.leaflet-bottom.leaflet-right{bottom:0}
#dir svg{display:block;margin:auto;transition:transform .3s}
#dir small{position:absolute;right:0;bottom:-16px;text-align:right;font-size:10px;color:#333;text-shadow:0 0 3px #fff;white-space:nowrap}
.me-ic svg{display:block}
#nav{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:10px;right:84px;z-index:1000;background:#fffe;border-radius:12px;
  box-shadow:0 2px 8px #0004;padding:8px 12px;font-size:18px;font-weight:bold;display:none}
#nav.off{color:#c00}
.pin{font-size:13px}
.pin button{margin:4px 2px 0;padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#fff}
.leaflet-control-attribution{font-size:10px}

<body>
<div id="map"></div>
<div id="panel">
  <div id="head"><span class="t">🚲 細道ルートナビ <small id="ver" style="font-weight:normal;font-size:11px;color:#999">v1109.1717</small></span><button id="fs" title="全画面">⛶</button><button id="tog">たたむ</button></div>

</div>
<div id="nav"></div>
<div id="inapp" style="display:none;position:absolute;left:8px;right:8px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:1001;background:#333;color:#fff;
  border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5">📱 X などのアプリの中で開いてるよ。現在地ナビを使うときは「︙」→「ブラウザで開く」で Chrome や Safari で開いてね
  <button onclick="this.parentNode.remove()" style="float:right;margin-left:8px;border:none;background:#555;color:#fff;border-radius:6px;padding:2px 8px">とじる</button></div>
<button id="gps" title="現在地についていく">◎</button>

<script id="router" type="text/plain">// ==== 細道ルート計算エンジン（Web Worker / Node 両用） ====
// 設定（cfg）はページ側から渡される。DEFAULT_CFG がおすすめ値
const DEFAULT_CFG = {
  pen: {                 // 1m を何m分と数えるか（大きいほど避ける）。"no" は通らない
    living_street: 1, residential: 1, service: 1.2, unclassified: 1.2, cycleway: 1,
    tertiary: 3, secondary: 5, primary: 8, trunk: 30,
    footway: 2, pedestrian: 1.5, path: 1.5, track: 1.5,
  },
  steps: "no",           // 階段: "no"=通らない / "ramp"=自転車スロープ付きなら / "yes"=通る
  bridge: 3,             // 歩道橋・地下道（歩行者用）: 倍率 or "no"
  unpaved: 20,           // 砂利・土の道: 倍率 or "no"（1=気にしない）
  wideCross: "signal",   // 4車線以上の横断: "signal" / "crosswalk" / "any"
  midCross: "prefer",    // 2車線の道の横断: "must" / "prefer" / "any"
};
const BASE = { tertiary_link: "tertiary", secondary_link: "secondary", primary_link: "primary", trunk_link: "trunk" };
const OTHER_PENALTY = 2.0;
const EXCLUDE = new Set(["motorway", "motorway_link", "construction", "proposed", "raceway", "bus_guideway",
  "elevator", "corridor", "platform", "bus_stop"]);
const UNPAVED = new Set(["gravel", "fine_gravel", "pebblestone", "unpaved", "dirt", "earth", "ground", "grass",
  "sand", "mud", "compacted", "woodchips", "rock", "grass_paver"]);
const SIGNAL_RADIUS = 35, CROSSWALK_RADIUS = 20;
const HARD = 3000, SOFT = 500;    // 横断ルールを守れないときの追加コスト(m相当)
const MID_ROADS = new Set(["tertiary", "secondary", "primary", "trunk"]);
const FOOTLIKE = new Set(["footway", "pedestrian", "path", "steps"]);
const KIND_JA = {
  living_street: "生活道路", residential: "住宅街の道", service: "私道・通路", unclassified: "細めの一般道",
  track: "農道", path: "小道", cycleway: "自転車道", pedestrian: "歩行者道", footway: "歩道",
  tertiary: "一般道", secondary: "県道クラス", primary: "国道・主要道", trunk: "幹線国道", steps: "階段", road: "道",
};
const OVERPASS_URLS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];

function lanesOf(t) { const n = parseInt(String(t.lanes || "0").split(";")[0]); return isNaN(n) ? 0 : n; }
function isOneway(t) { return ["yes", "1", "true", "-1"].includes(t.oneway); }
function isWide(t) {
  const hw = t.highway || "", n = lanesOf(t), ow = isOneway(t);
  if (n >= 4) return true;
  if ((hw === "trunk" || hw === "trunk_link") && n !== 2 && !(ow && n === 1)) return true;
  if (["trunk", "primary", "secondary"].includes(hw) && ow && n >= 2) return true;
  return false;
}
// 横断のときの道の格: 2=4車線以上 / 1=2車線の道（一般道以上 or 2車線） / 0=細い道
function levelOf(t) {
  if (isWide(t)) return 2;
  const b = BASE[t.highway] || t.highway;
  if (MID_ROADS.has(b) || lanesOf(t) >= 2) return 1;
  return 0;
}
function isUnpaved(t) {
  const sf = t.surface || "";
  if (UNPAVED.has(sf) || ["grade3", "grade4", "grade5"].includes(t.tracktype)) return "sure";
  if (!sf && (t.highway === "track" || t.highway === "path") && t.tracktype !== "grade1") return "maybe";
  return null;
}
const yes = v => v && v !== "no";
// 道1本の倍率と表示名。通らないなら null
function wayCost(t, cfg) {
  const hw = t.highway, b = BASE[hw] || hw;
  let p, name = KIND_JA[b] || b;
  if (hw === "steps") {
    if (cfg.steps === "no") return null;
    if (cfg.steps === "ramp" && t["ramp:bicycle"] !== "yes") return null;
    p = cfg.steps === "ramp" ? 8 : 5;
    name = cfg.steps === "ramp" ? "自転車スロープ付き階段" : "階段";
  } else {
    p = cfg.pen[b] ?? OTHER_PENALTY;
    if (p === "no") return null;
    if (lanesOf(t) >= 2 && p > 1) p *= 1.5;
  }
  if (FOOTLIKE.has(hw) && (yes(t.bridge) || yes(t.tunnel))) {
    if (cfg.bridge === "no") return null;
    p *= cfg.bridge; name = yes(t.bridge) ? "歩道橋" : "地下道";
  }
  const u = isUnpaved(t);
  if (u) {
    if (u === "sure" && cfg.unpaved === "no") return null;
    const m = cfg.unpaved === "no" ? 20 : cfg.unpaved;
    p *= u === "sure" ? m : Math.max(1, Math.sqrt(m));
    name = u === "sure" ? "砂利・土の道" : "舗装不明の小道";
  }
  return [p, name];
}
const R = 6371000, RAD = Math.PI / 180;
function hav(la1, lo1, la2, lo2) {
  const a = Math.sin((la2 - la1) * RAD / 2) ** 2 + Math.cos(la1 * RAD) * Math.cos(la2 * RAD) * Math.sin((lo2 - lo1) * RAD / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function overpassQuery(b) {
  return `[out:json][timeout:120];
way["highway"]["highway"!~"^(motorway|motorway_link|construction|proposed|platform|corridor|elevator|raceway|bus_guideway|bus_stop)$"]["access"!~"^(no|private)$"]["service"!~"^(parking_aisle|drive-through)$"](${b.s},${b.w},${b.n},${b.e});
(._;>;);
out body qt;`;
}

async function fetchOSM(b, prog, start = 0) {
  const body = "data=" + encodeURIComponent(overpassQuery(b));
  const urls = OVERPASS_URLS.map((_, i) => OVERPASS_URLS[(i + start) % OVERPASS_URLS.length]);
  let last;
  for (let round = 0; round < 3; round++) {
    for (const url of urls) {
      const host = new URL(url).host;
      try {
        prog({ msg: `${host} サーバーが計算中`, done: 0, total: 0 });
        const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), 150000);
        const res = await fetch(url, { method: "POST", body, signal: ac.signal,
          headers: { "Content-Type": "application/x-www-form-urlencoded" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const total = +res.headers.get("Content-Length") || 0;
        const reader = res.body.getReader(); const chunks = []; let done = 0;
        for (;;) {
          const { value, done: fin } = await reader.read();
          if (fin) break;
          chunks.push(value); done += value.length;
          prog({ msg: `${host} ダウンロード中`, done, total });
        }
        clearTimeout(timer);
        const buf = new Uint8Array(done); let o = 0;
        for (const c of chunks) { buf.set(c, o); o += c.length; }
        prog({ msg: "データを読みこみ中", done, total: done });
        const text = new TextDecoder().decode(buf);
        const json = JSON.parse(text);
        if (json.remark && /error|timed out|memory/i.test(json.remark)) throw new Error(json.remark.slice(0, 80));
        return { json, text };
      } catch (e) {
        last = e; prog({ msg: `${host} 失敗: ${e.message}`, warn: true });
      }
    }
    if (round < 2) { prog({ msg: "10秒待ってもう一周…" }); await new Promise(r => setTimeout(r, 10000)); }
  }
  throw new Error("OSMのデータが取れませんでした（" + (last?.message || "") + "）。少し待ってもう一度ためしてね");
}

function buildGraph(osm, cfg, onProg) {
  cfg = { ...DEFAULT_CFG, ...cfg, pen: { ...DEFAULT_CFG.pen, ...(cfg && cfg.pen) } };
  const idx = new Map(), lat = [], lon = [], ntags = new Map();
  for (const e of osm.elements) if (e.type === "node") {
    idx.set(e.id, lat.length); if (e.tags) ntags.set(lat.length, e.tags); lat.push(e.lat); lon.push(e.lon);
  }
  const N = lat.length, adj = Array.from({ length: N }, () => []);
  const lvl = new Uint8Array(N), inGraph = new Uint8Array(N);
  const d = (u, v) => hav(lat[u], lon[u], lat[v], lon[v]);
  const NE = osm.elements.length; let ei = 0;
  const mainWays = [];
  for (const e of osm.elements) {
    if (onProg && (++ei & 0x3fff) === 0) onProg(ei / NE * 0.9);
    if (e.type !== "way") continue;
    const t = e.tags || {}, hw = t.highway;
    if (!hw || EXCLUDE.has(hw)) continue;
    if (t.access === "no" || t.access === "private" || t.bicycle === "no") continue;
    const nd = e.nodes.map(id => idx.get(id)).filter(x => x !== undefined);
    if (nd.length < 2) continue;
    const L0 = levelOf(t);
    if (L0) { mainWays.push([nd, L0]); for (const i of nd) if (L0 > lvl[i]) lvl[i] = L0; }   // 通らない道でも「横断する道」としては数える
    const wc = wayCost(t, cfg);
    if (!wc) continue;
    let [pen, name] = wc;
    if (["footway", "path", "pedestrian", "cycleway", "track"].includes(hw) && nd.some(i => ntags.get(i)?.railway === "crossing")) {
      let wl = 0; for (let i = 1; i < nd.length; i++) wl += d(nd[i - 1], nd[i]);
      if (wl < 200) { pen = 1.0; name = "歩行者・自転車用踏切"; }
    }
    let ow = t.oneway; if (t["oneway:bicycle"] === "no") ow = "no";
    const fwd = ow !== "-1", back = !["yes", "1", "true"].includes(ow);
    for (let i = 1; i < nd.length; i++) {
      const u = nd[i - 1], v = nd[i], L = d(u, v);
      inGraph[u] = 1; inGraph[v] = 1;
      if (fwd) adj[u].push({ v, c: L * pen, L, l: L0, k: name });
      if (back) adj[v].push({ v: u, c: L * pen, L, l: L0, k: name });
    }
  }
  // 大きい道の向き（横断かどうか＝道の反対側に出るかを判定するため）
  const dirX = new Float32Array(N), dirY = new Float32Array(N);
  const cosl = Math.cos((lat[0] || 35) * RAD);
  for (const [nd, L0] of mainWays) for (let k = 0; k < nd.length; k++) {
    const i = nd[k]; if (lvl[i] !== L0 || dirX[i] || dirY[i]) continue;
    const a = nd[Math.max(0, k - 1)], b = nd[Math.min(nd.length - 1, k + 1)];
    dirX[i] = (lon[b] - lon[a]) * cosl * 111320; dirY[i] = (lat[b] - lat[a]) * 111320;
  }
  // 信号・横断歩道の場所
  const mkGrid = () => new Map();
  const gSig = mkGrid(), gXw = mkGrid();
  const put = (g, i) => { const k = Math.round(lat[i] * 2000) + "," + Math.round(lon[i] * 2000); if (!g.has(k)) g.set(k, []); g.get(k).push(i); };
  for (const [i, t] of ntags) {
    if (t.highway === "traffic_signals" || t.crossing === "traffic_signals" || t["crossing:signals"] === "yes") put(gSig, i);
    else if (t.highway === "crossing" && !["no", "unmarked", "informal"].includes(t.crossing)) put(gXw, i);
  }
  const near = (g, i, r) => {
    const a = Math.round(lat[i] * 2000), b = Math.round(lon[i] * 2000);
    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++)
      for (const j of g.get((a + x) + "," + (b + y)) || []) if (d(i, j) <= r) return true;
    return false;
  };
  // 横断の追加コスト（その点で lvl の道を横切るとき）と種類 1=信号 2=横断歩道 3=なし
  const xcost = new Float32Array(N), xkind = new Uint8Array(N);
  let nNodes = 0;
  for (let i = 0; i < N; i++) {
    if (inGraph[i]) nNodes++;
    if (!lvl[i] || !inGraph[i]) continue;
    const sig = near(gSig, i, SIGNAL_RADIUS), xw = near(gXw, i, CROSSWALK_RADIUS);
    xkind[i] = sig ? 1 : xw ? 2 : 3;

function cleanAddr(t) {

  a = a.replace(/〒?\s*\d{3}-\d{4}/, "").replace(/\s+/g, "");
  const m = a.match(/^.+?\d+丁目(?:\d+(?:番地|番|号|-)?)*/) || a.match(/^.+?\d+(?:-\d+)+/) || a.match(/^.+?\d+番地?(?:\d+号?)?/);
  return m ? m[0].replace(/-$/, "") : a;
}
async function geocode(text) {

    const m = text.match(/!3d(-?[\d.]+)!4d(-?[\d.]+)/) || text.match(/@(-?[\d.]+),(-?[\d.]+)/) || decodeURIComponent(text).match(/[?&](?:q|query|ll)=(-?[\d.]+),\s*(-?[\d.]+)/);
    if (m) return [[+m[1], +m[2]], "GoogleマップのURL"];
    throw new Error("このURLから場所が読み取れませんでした。短縮URL(maps.app.goo.gl)のときは、開いたあとのURLを貼ってね");
  }
  const ll = text.normalize("NFKC").replace(/\s/g, "").match(/^(-?\d+\.\d+)[,、](-?\d+\.\d+)$/);
  if (ll) return [[+ll[1], +ll[2]], "座標"];
  const gsi = async () => {
    const q = cleanAddr(text);
    const r = await (await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q))).json();
    if (r.length) return [[r[0].geometry.coordinates[1], r[0].geometry.coordinates[0]], r[0].properties.title];
  };
  const nomi = async () => {
    const q = text.normalize("NFKC").replace(/〒?\s*\d{3}[-‐－―ー−]\d{4}/, "").trim();
    const r = await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q=" + encodeURIComponent(q))).json();
    if (r.length) return [[+r[0].lat, +r[0].lon], r[0].display_name.split(",").slice(0, 3).join(",")];
  };
  const looksAddr = /丁目|番地|番|号|\d+\s*[-‐－―ー−]\s*\d+|[０-９]+[‐－―ー−][０-９]+/.test(text);
  for (const fn of looksAddr ? [gsi, nomi] : [nomi, gsi]) {
    try { const r = await fn(); if (r) return r; } catch (e) { console.warn(e); }
  }

  for (let i = 1; i < r.length; i++) {
    const [ax, ay] = X(r[i - 1]), [bx, by] = X(r[i]), dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1e-9;
    let t = -(ax * dx + ay * dy) / L2; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < bd) { bd = d; bi = i; bt = t; }
  }
  const along = cum[bi - 1] + bt * (cum[bi] - cum[bi - 1]);
  return [bd, cum[cum.length - 1] - along];
}
function onPos(p) {
  const ll = [p.coords.latitude, p.coords.longitude];
  updHeading(p.coords, ll);
  const first = !me;
  if (!me) {
    acc = L.circle(ll, { radius: p.coords.accuracy, color: "#1a73e8", weight: 1, fillOpacity: .1, interactive: false }).addTo(map);
    me = L.marker(ll, { icon: icDot, interactive: false, zIndexOffset: 1000, rotateWithView: true, rotation: 0 }).addTo(map);
  }
  me.setLatLng(ll); acc.setLatLng(ll).setRadius(p.coords.accuracy);
  applyBearing();
  if (follow) map.setView(ll, first ? Math.max(map.getZoom(), 16) : map.getZoom(), { animate: true });  // 拡大率はそのまま
  if (cur && cur.route.length > 1) {
    const [off, rest] = nearestOnRoute(ll), nav = $("nav");
    nav.style.display = "block";
    nav.className = off > 60 ? "off" : "";
    nav.textContent = rest < 30 ? "🎉 とうちゃく！" : `のこり ${fmtKm(rest)}` + (off > 60 ? `　⚠ ルートから ${Math.round(off)}m` : "");
  }
}
async function wake() { try { lock = await navigator.wakeLock.request("screen"); } catch {} }
$("gps").onclick = () => {
  if (wid === null) {
    if (!navigator.geolocation) return alert("この端末では位置情報が使えません");
    wid = navigator.geolocation.watchPosition(onPos, onGeoErr, { enableHighAccuracy: true, maximumAge: 2000 });
    setFollow(true); wake();
    $("dir").style.display = "block";
    $("panel").classList.add("min"); $("tog").textContent = "ひらく";
  } else {
    setFollow(!follow);
  }
};
$("dir").onclick = () => {
  headUp = !headUp;
  $("dir").classList.toggle("on", headUp);
  if (!headUp) $("dirL").textContent = "北が上";
  applyBearing();
};
// ナビ中は地図を動かせない（拡大・縮小だけ。自分の位置を中心に）。◎をもう一度押すまで解除しない
function setFollow(on) {
  follow = on;
  $("gps").classList.toggle("on", on);
  const z = on ? "center" : true;
  map.options.touchZoom = z; map.options.scrollWheelZoom = z; map.options.doubleClickZoom = z;
  if (on) { map.dragging.disable(); if (me) map.setView(me.getLatLng(), Math.max(map.getZoom(), 16)); }
  else map.dragging.enable();
}
document.addEventListener("visibilitychange", () => { if (wid !== null && document.visibilityState === "visible") wake(); });

// ---------- 共有URLから開いたとき ----------
function loadHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get("r")) return;
  try {
    showRoute({ route: decPoly(h.get("r")), ok: h.get("ok") ? decPoly(h.get("ok")) : [], xw: h.get("xw") ? decPoly(h.get("xw")) : [], ng: h.get("ng") ? decPoly(h.get("ng")) : [], name: "共有されたルート" }, true);
    $("bNew").style.display = ""; $("panel").classList.add("min"); $("tog").textContent = "ひらく";
  } catch (e) { setMsg("共有URLが読めませんでした", true); }
}
window.addEventListener("hashchange", loadHash);

// ---------- ルートの保存（この端末のブラウザの中に） ----------
const RKEY = "hosomichi_routes", LKEY = "hosomichi_last";
function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { alert("保存できませんでした（容量がいっぱいかも）"); return false; } }
function packRoute(r) {
  return { name: r.name || "", created: r.created || Date.now(), r: encPoly(simplify(r.route, 1)),
    s: r.short ? encPoly(simplify(r.short, 3)) : "", ok: encPoly(r.ok || []), xw: encPoly(r.xw || []), ng: encPoly(r.ng || []),
    len: r.len, slen: r.slen || 0, kinds: r.kinds || null };
}
function unpackRoute(o) {
  return { name: o.name, created: o.created, route: decPoly(o.r), short: o.s ? decPoly(o.s) : null,
    ok: decPoly(o.ok || ""), xw: decPoly(o.xw || ""), ng: decPoly(o.ng || ""), len: o.len, slen: o.slen, kinds: o.kinds };
}
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function renderList() {
  const rs = lsGet(RKEY, []);
  $("nSaved").textContent = rs.length;
  $("list").innerHTML = rs.length ? rs.slice().sort((a, b) => b.created - a.created).map(o =>
    `<div class="it" data-id="${o.id}"><div class="nm" data-a="open"><b>${esc(o.name || "名前なし")}</b>` +
    `<small>${fmtKm(o.len)}・${new Date(o.created).toLocaleDateString("ja-JP")}</small></div>` +
    `<button data-a="ren">名前</button><button data-a="del">🗑</button></div>`).join("")
    : '<div style="font-size:12px;color:#888;padding:6px">まだないよ。ルートを作って「💾 保存」してね</div>';
}
$("bList").onclick = () => { const l = $("list"); l.style.display = l.style.display === "block" ? "none" : "block"; renderList(); };
$("list").onclick = ev => {
  const a = ev.target.closest("[data-a]")?.dataset.a, it = ev.target.closest(".it"); if (!a || !it) return;
  const rs = lsGet(RKEY, []), i = rs.findIndex(o => String(o.id) === it.dataset.id); if (i < 0) return;
  if (a === "open") {
    showRoute({ ...unpackRoute(rs[i]), savedId: rs[i].id }, true);
    $("bNew").style.display = ""; setMsg(`「${rs[i].name}」を開いたよ`);
    $("list").style.display = "none";
  } else if (a === "ren") {
    const n = prompt("ルートの名前", rs[i].name); if (n == null) return;
    rs[i].name = n.trim() || rs[i].name; lsSet(RKEY, rs); renderList();
  } else if (a === "del") {
    if (!confirm(`「${rs[i].name}」を消す？`)) return;
    rs.splice(i, 1); lsSet(RKEY, rs); renderList();
    if (cur && String(cur.savedId) === it.dataset.id) { cur.savedId = null; updSaveBtn(); }
  }
};
function updSaveBtn() { $("bSave").textContent = cur && cur.savedId ? "💾 保存ずみ ✓" : "💾 保存"; }
$("bSave").onclick = () => {
  if (!cur) return;
  const rs = lsGet(RKEY, []);
  const old = cur.savedId ? rs.find(o => o.id === cur.savedId) : null;
  const n = prompt(old ? "名前を変えて上書き保存するよ" : "ルートの名前をつけてね", cur.name || "");
  if (n == null) return;
  cur.name = n.trim() || cur.name || "名前なし";
  if (old) Object.assign(old, packRoute(cur), { id: old.id, created: old.created });
  else { cur.savedId = Date.now(); rs.push({ ...packRoute(cur), id: cur.savedId, created: Date.now() }); }
  if (lsSet(RKEY, rs)) { updSaveBtn(); renderList(); }
};
renderList();

if (IN_APP) $("inapp").style.display = "block";

// ---------- 開いたとき：共有URL → なければ前回のルート ----------
if (location.hash.includes("r=")) loadHash();
else {
  const last = lsGet(LKEY, null);
  if (last) { try { showRoute(unpackRoute(last), true); setMsg("前回のルートを表示してるよ"); $("bNew").style.display = ""; } catch {} }
}
</script>
</body></html>
