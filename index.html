<script id="router" type="text/plain">// ==== 細道ルート計算エンジン（Web Worker / Node 両用） ====
const PENALTY = {
  living_street: 1.0, residential: 1.0, service: 1.1, unclassified: 1.2, track: 1.3, path: 1.3,
  cycleway: 1.0, pedestrian: 1.5, footway: 2.0, steps: 15.0,
  tertiary: 3.0, tertiary_link: 3.0, secondary: 6.0, secondary_link: 6.0,
  primary: 10.0, primary_link: 10.0, trunk: 30.0, trunk_link: 30.0,
};
const DEFAULT_PENALTY = 2.0;
const EXCLUDE = new Set(["motorway", "motorway_link", "construction", "proposed", "raceway", "bus_guideway",
  "elevator", "corridor", "platform", "bus_stop"]);
const UNPAVED = new Set(["gravel", "fine_gravel", "pebblestone", "unpaved", "dirt", "earth", "ground", "grass",
  "sand", "mud", "compacted", "woodchips", "rock", "grass_paver"]);
const UNPAVED_PENALTY = 20.0, UNKNOWN_TRACK_PENALTY = 6.0;
const SIGNAL_RADIUS = 35, CROSS_PENALTY = 3000;
const KIND_JA = {
  living_street: "生活道路", residential: "住宅街の道", service: "私道・通路", unclassified: "細めの一般道",
  track: "農道", path: "小道", cycleway: "自転車道", pedestrian: "歩行者道", footway: "歩道",
  tertiary: "一般道", tertiary_link: "一般道", secondary: "県道クラス", secondary_link: "県道クラス",
  primary: "国道・主要道", primary_link: "国道・主要道", trunk: "幹線国道", trunk_link: "幹線国道",
  steps: "スロープ付き階段", road: "道",
};
const OVERPASS_URLS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];

function lanesOf(t) { const n = parseInt(String(t.lanes || "0").split(";")[0]); return isNaN(n) ? 0 : n; }
function isOneway(t) { return ["yes", "1", "true", "-1"].includes(t.oneway); }
function isWide(t) {
  const hw = t.highway || "", n = lanesOf(t), ow = isOneway(t);
  if (n >= 4) return true;
  if ((hw === "trunk" || hw === "trunk_link") && n !== 2 && !(ow && n === 1)) return true;
  if (["trunk", "primary", "secondary"].includes(hw) && ow && n >= 2) return true;
  return false;
}
function unpaved(t) {
  const sf = t.surface || "";
  if (UNPAVED.has(sf)) return [UNPAVED_PENALTY, "砂利・土の道"];
  if (["grade3", "grade4", "grade5"].includes(t.tracktype)) return [UNPAVED_PENALTY, "砂利・土の道"];
  if (!sf && (t.highway === "track" || t.highway === "path") && t.tracktype !== "grade1") return [UNKNOWN_TRACK_PENALTY, "舗装不明の小道"];
  return null;
}
function hasBikeRamp(t) { return ["ramp:bicycle", "ramp:stroller", "ramp:wheelchair", "ramp"].some(k => t[k] === "yes"); }
function wayPenalty(t, hosoi) {
  let p = PENALTY[t.highway] ?? DEFAULT_PENALTY;
  if (lanesOf(t) >= 2) p *= 1.5;
  p = 1 + (p - 1) * (hosoi / 5);
  const u = unpaved(t); if (u) p *= u[0];
  return p;
}
const R = 6371000, RAD = Math.PI / 180;
function hav(la1, lo1, la2, lo2) {
  const a = Math.sin((la2 - la1) * RAD / 2) ** 2 + Math.cos(la1 * RAD) * Math.cos(la2 * RAD) * Math.sin((lo2 - lo1) * RAD / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function overpassQuery(b) {
  return `[out:json][timeout:120];
way["highway"]["highway"!~"^(motorway|motorway_link|construction|proposed|platform|corridor|elevator|raceway|bus_guideway|bus_stop)$"]["access"!~"^(no|private)$"]["service"!~"^(parking_aisle|drive-through)$"](${b.s},${b.w},${b.n},${b.e});
(._;>;);
out body qt;`;
}

async function fetchOSM(b, prog) {
  const body = "data=" + encodeURIComponent(overpassQuery(b));
  let last;
  for (let round = 0; round < 3; round++) {
    for (const url of OVERPASS_URLS) {
      const host = new URL(url).host;
      try {
        prog({ msg: `${host} サーバーが計算中`, done: 0, total: 0 });
        const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), 150000);
        const res = await fetch(url, { method: "POST", body, signal: ac.signal,
          headers: { "Content-Type": "application/x-www-form-urlencoded" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const total = +res.headers.get("Content-Length") || 0;
        const reader = res.body.getReader(); const chunks = []; let done = 0;
        for (;;) {
          const { value, done: fin } = await reader.read();
          if (fin) break;
          chunks.push(value); done += value.length;
          prog({ msg: `${host} ダウンロード中`, done, total });
        }
        clearTimeout(timer);
        const buf = new Uint8Array(done); let o = 0;
        for (const c of chunks) { buf.set(c, o); o += c.length; }
        prog({ msg: "データを読みこみ中", done, total: done });
        const text = new TextDecoder().decode(buf);
        const json = JSON.parse(text);
        if (json.remark && /error|timed out|memory/i.test(json.remark)) throw new Error(json.remark.slice(0, 80));
        return { json, text };
      } catch (e) {
        last = e; prog({ msg: `${host} 失敗: ${e.message}`, warn: true });
      }
    }
    if (round < 2) { prog({ msg: "10秒待ってもう一周…" }); await new Promise(r => setTimeout(r, 10000)); }
  }
  throw new Error("OSMのデータが取れませんでした（" + (last?.message || "") + "）。少し待ってもう一度ためしてね");
}

function buildGraph(osm, hosoi, onProg) {
  const idx = new Map(), lat = [], lon = [], ntags = new Map();
  for (const e of osm.elements) if (e.type === "node") {
    idx.set(e.id, lat.length); if (e.tags) ntags.set(lat.length, e.tags); lat.push(e.lat); lon.push(e.lon);
  }
  const N = lat.length, adj = Array.from({ length: N }, () => []);
  const wide = new Uint8Array(N), inGraph = new Uint8Array(N);
  const d = (u, v) => hav(lat[u], lon[u], lat[v], lon[v]);
  const NE = osm.elements.length; let ei = 0;
  for (const e of osm.elements) {
    if (onProg && (++ei & 0x3fff) === 0) onProg(ei / NE * 0.9);
    if (e.type !== "way") continue;
    const t = e.tags || {}, hw = t.highway;
    if (!hw || EXCLUDE.has(hw)) continue;
    if (t.access === "no" || t.access === "private" || t.bicycle === "no") continue;
    if (hw === "steps" && !hasBikeRamp(t)) continue;
    const nd = e.nodes.map(id => idx.get(id)).filter(x => x !== undefined);
    if (nd.length < 2) continue;
    let pen = wayPenalty(t, hosoi);
    let name = KIND_JA[hw] || hw;
    const up = unpaved(t); if (up) name = up[1];
    if (["footway", "path", "pedestrian", "cycleway", "track"].includes(hw) && nd.some(i => ntags.get(i)?.railway === "crossing")) {
      let wl = 0; for (let i = 1; i < nd.length; i++) wl += d(nd[i - 1], nd[i]);
      if (wl < 200) { pen = 1.0; name = "歩行者・自転車用踏切"; }
    }
    const w = isWide(t);
    let ow = t.oneway; if (t["oneway:bicycle"] === "no") ow = "no";
    const fwd = ow !== "-1", back = !["yes", "1", "true"].includes(ow);
    for (let i = 1; i < nd.length; i++) {
      const u = nd[i - 1], v = nd[i], L = d(u, v);
      if (w) { wide[u] = 1; wide[v] = 1; }
      inGraph[u] = 1; inGraph[v] = 1;
      if (fwd) adj[u].push({ v, c: L * pen, L, w, k: name });
      if (back) adj[v].push({ v: u, c: L * pen, L, w, k: name });
    }
  }
  // 信号
  const grid = new Map();
  for (const [i, t] of ntags) {
    if (t.highway === "traffic_signals" || t.crossing === "traffic_signals" || t["crossing:signals"] === "yes") {
      const k = Math.round(lat[i] * 2000) + "," + Math.round(lon[i] * 2000);
      if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i);
    }
  }
  const nearSignal = i => {
    const a = Math.round(lat[i] * 2000), b = Math.round(lon[i] * 2000);
    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++)
      for (const j of grid.get((a + x) + "," + (b + y)) || []) if (d(i, j) <= SIGNAL_RADIUS) return true;
    return false;
  };
  const flag = new Uint8Array(N); let nDanger = 0, nNodes = 0; // 1=信号なし危険, 2=信号あり
  for (let i = 0; i < N; i++) {
    if (inGraph[i]) nNodes++;
    if (wide[i]) { flag[i] = nearSignal(i) ? 2 : 1; if (flag[i] === 1) nDanger++; }
  }
  return { lat, lon, adj, flag, inGraph, nDanger, nNodes };
}

function nearest(G, la, lo) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < G.lat.length; i++) {
    if (!G.inGraph[i]) continue;
    const dd = hav(la, lo, G.lat[i], G.lon[i]);
    if (dd < bd) { bd = dd; best = i; }
  }
  return [best, bd];
}

class Heap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(k, v) {
    const K = this.k, V = this.v; let i = K.length; K.push(k); V.push(v);
    while (i > 0) { const p = (i - 1) >> 1; if (K[p] <= k) break; K[i] = K[p]; V[i] = V[p]; i = p; }
    K[i] = k; V[i] = v;
  }
  pop() {
    const K = this.k, V = this.v, rk = K[0], rv = V[0], lk = K.pop(), lv = V.pop(), n = K.length;
    if (n) {
      let i = 0;
      for (;;) {
        let c = 2 * i + 1; if (c >= n) break;
        if (c + 1 < n && K[c + 1] < K[c]) c++;
        if (K[c] >= lk) break;
        K[i] = K[c]; V[i] = V[c]; i = c;
      }
      K[i] = lk; V[i] = lv;
    }
    return [rk, rv];
  }
}

function dijkstra(G, s, g, useLen, onProg) {
  const N = G.lat.length, best = new Float64Array(N * 2).fill(Infinity), prev = new Int32Array(N * 2).fill(-1);
  const h = new Heap(); best[s * 2] = 0; h.push(0, s * 2);
  let goal = -1, pops = 0, far = 0;
  const D0 = hav(G.lat[s], G.lon[s], G.lat[g], G.lon[g]) || 1;
  while (h.size) {
    const [c, st] = h.pop();
    if (c > best[st]) continue;
    const u = st >> 1, uw = st & 1;
    if (onProg && (++pops & 0x7fff) === 0) {  // ゴールにどれだけ近づいたかで進み具合を出す
      far = Math.max(far, 1 - hav(G.lat[u], G.lon[u], G.lat[g], G.lon[g]) / D0);
      onProg(Math.min(0.99, Math.max(0, far)));
    }
    if (u === g) { goal = st; break; }
    const danger = !useLen && G.flag[u] === 1 && u !== s && !uw;
    for (const e of G.adj[u]) {
      let nc = c + (useLen ? e.L : e.c);
      if (danger && !e.w) nc += CROSS_PENALTY;
      const ns = e.v * 2 + (e.w ? 1 : 0);
      if (nc < best[ns]) { best[ns] = nc; prev[ns] = st; h.push(nc, ns); }
    }
  }
  if (goal < 0) throw new Error("ルートが見つかりませんでした（道がつながっていないかも）");
  const path = []; for (let st = goal; st >= 0; st = prev[st]) path.push(st >> 1);
  return path.reverse();
}

function edge(G, u, v) {
  let best = null; for (const e of G.adj[u]) if (e.v === v && (!best || e.c < best.c)) best = e;
  return best;
}

function analyze(G, path) {
  const ok = [], ng = [], kinds = {}; let len = 0;
  for (let i = 1; i < path.length; i++) {
    const e = edge(G, path[i - 1], path[i]); len += e.L; kinds[e.k] = (kinds[e.k] || 0) + e.L;
  }
  for (let i = 1; i < path.length - 1; i++) {
    const u = path[i]; if (!G.flag[u]) continue;
    if (!edge(G, path[i - 1], u).w && !edge(G, u, path[i + 1]).w) (G.flag[u] === 1 ? ng : ok).push([G.lat[u], G.lon[u]]);
  }
  return { ok, ng, kinds, len };
}

// ==== タイル分割取得 ＋ 保存（メモリ ＋ IndexedDB） ====
// 範囲を TILE 度ごとのマスに分けて、1マスずつ取得・保存する
const TILE = 0.03;                 // 約3.3km × 2.7km
const PARALLEL = 2;                // 同時に取るマスの数（Overpassは1人2枠くらい）
const DB_NAME = "hosomichi", STORE = "tiles", MAX_AGE = 30 * 864e5, MAX_TILES = 400;
const mem = new Map();             // key -> elements
let dbp = null;
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise(ok => {
    if (typeof indexedDB === "undefined") return ok(null);
    try {
      const r = indexedDB.open(DB_NAME, 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (db.objectStoreNames.contains("osm")) db.deleteObjectStore("osm");   // 古い形式は捨てる
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "key" });
      };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ok(null);
    } catch { ok(null); }
  });
  return dbp;
}
function req(r) { return new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); }); }
async function store(mode) { const db = await openDB(); return db ? db.transaction(STORE, mode).objectStore(STORE) : null; }
async function pack(text) {
  if (typeof CompressionStream !== "undefined") {
    const s = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
    return { gz: true, blob: await new Response(s).blob() };
  }
  return { gz: false, blob: new Blob([text]) };
}
async function unpack(rec) {
  let s = rec.blob.stream();
  if (rec.gz) s = s.pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(s).text());
}
async function getTile(key) {
  try {
    const st = await store("readonly"); if (!st) return null;
    const r = await req(st.get(key));
    if (!r) return null;
    if (Date.now() - r.savedAt > MAX_AGE) return null;
    return (await unpack(r)).elements;
  } catch { return null; }
}
async function putTile(key, text) {
  try {
    const { gz, blob } = await pack(text);
    const st = await store("readwrite"); if (!st) return;

  if (follow) return;
  const v = e.latlng.lat.toFixed(6) + "," + e.latlng.lng.toFixed(6);
  const div = document.createElement("div"); div.className = "pin";
  div.innerHTML = "ここを<br><button data-k='from'>出発にする</button><button data-k='to'>到着にする</button>";
  const pop = L.popup().setLatLng(e.latlng).setContent(div).openOn(map);
  div.onclick = ev => { const k = ev.target.dataset.k; if (!k) return; $(k).value = v; map.closePopup(pop); $("panel").classList.remove("min"); $("tog").textContent = "たたむ"; };
});

// ---------- 現在地ナビ ----------
let me = null, acc = null, follow = false, wid = null, lock = null;
let headUp = false, heading = null, lastFix = null;
const SVG_DOT = '<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="8" fill="#1a73e8" stroke="#fff" stroke-width="3"/></svg>';
const SVG_ARROW = '<svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="19" r="8" fill="#1a73e8" stroke="#fff" stroke-width="3"/><polygon points="17,1 24,13 10,13" fill="#1a73e8" stroke="#fff" stroke-width="2"/></svg>';
const icDot = L.divIcon({ className: "me-ic", html: SVG_DOT, iconSize: [26, 26], iconAnchor: [13, 13] });
const icArrow = L.divIcon({ className: "me-ic", html: SVG_ARROW, iconSize: [34, 34], iconAnchor: [17, 19] });
function bearingDeg(a, b) {
  const y = Math.sin((b[1] - a[1]) * RAD) * Math.cos(b[0] * RAD);
  const x = Math.cos(a[0] * RAD) * Math.sin(b[0] * RAD) - Math.sin(a[0] * RAD) * Math.cos(b[0] * RAD) * Math.cos((b[1] - a[1]) * RAD);
  return (Math.atan2(y, x) / RAD + 360) % 360;
}
function updHeading(c, ll) {
  // 進んでいる向き：GPSの進行方向（動いているとき）→ なければ前の位置から計算
  if (c.heading != null && !isNaN(c.heading) && (c.speed || 0) > 1.2) heading = c.heading;
  else if (lastFix && hav(lastFix, ll) > 8) heading = bearingDeg(lastFix, ll);
  if (!lastFix || hav(lastFix, ll) > 8) lastFix = ll;
}
function applyBearing() {
  const b = headUp && heading != null ? -heading : 0;
  if (headUp) $("dirL").textContent = heading == null ? "動くと回るよ" : "進む向きが上";
  map.setBearing(b);
  $("needle").style.transform = `rotate(${b}deg)`;
  if (me) { me.setIcon(heading != null ? icArrow : icDot); me.setRotation(heading != null ? heading * RAD : 0); }
}
function nearestOnRoute(p) {
  const r = cur.route, c = Math.cos(p[0] * RAD), X = q => [(q[1] - p[1]) * c * 111320, (q[0] - p[0]) * 111320];
  let bd = Infinity, bi = 0, bt = 0;
  for (let i = 1; i < r.length; i++) {
    const [ax, ay] = X(r[i - 1]), [bx, by] = X(r[i]), dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1e-9;
    let t = -(ax * dx + ay * dy) / L2; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < bd) { bd = d; bi = i; bt = t; }
  }
  const along = cum[bi - 1] + bt * (cum[bi] - cum[bi - 1]);
  return [bd, cum[cum.length - 1] - along];
}
function onPos(p) {
  const ll = [p.coords.latitude, p.coords.longitude];
  updHeading(p.coords, ll);
  const first = !me;
  if (!me) {
    acc = L.circle(ll, { radius: p.coords.accuracy, color: "#1a73e8", weight: 1, fillOpacity: .1, interactive: false }).addTo(map);
    me = L.marker(ll, { icon: icDot, interactive: false, zIndexOffset: 1000, rotateWithView: true, rotation: 0 }).addTo(map);
  }
  me.setLatLng(ll); acc.setLatLng(ll).setRadius(p.coords.accuracy);
  applyBearing();
  if (follow) map.setView(ll, first ? Math.max(map.getZoom(), 16) : map.getZoom(), { animate: true });  // 拡大率はそのまま
  if (cur && cur.route.length > 1) {
    const [off, rest] = nearestOnRoute(ll), nav = $("nav");
    nav.style.display = "block";
    nav.className = off > 60 ? "off" : "";
    nav.textContent = rest < 30 ? "🎉 とうちゃく！" : `のこり ${fmtKm(rest)}` + (off > 60 ? `　⚠ ルートから ${Math.round(off)}m` : "");
  }
}
async function wake() { try { lock = await navigator.wakeLock.request("screen"); } catch {} }
$("gps").onclick = () => {
  if (wid === null) {
    if (!navigator.geolocation) return alert("この端末では位置情報が使えません");
    wid = navigator.geolocation.watchPosition(onPos, e => setMsg("位置情報エラー: " + e.message, true), { enableHighAccuracy: true, maximumAge: 2000 });
    setFollow(true); wake();
    $("dir").style.display = "block";
    $("panel").classList.add("min"); $("tog").textContent = "ひらく";
  } else {
    setFollow(!follow);
  }
};
$("dir").onclick = () => {
  headUp = !headUp;
  $("dir").classList.toggle("on", headUp);
  if (!headUp) $("dirL").textContent = "北が上";
  applyBearing();
};
// ナビ中は地図を動かせない（拡大・縮小だけ。自分の位置を中心に）。◎をもう一度押すまで解除しない
function setFollow(on) {
  follow = on;
  $("gps").classList.toggle("on", on);
  const z = on ? "center" : true;
  map.options.touchZoom = z; map.options.scrollWheelZoom = z; map.options.doubleClickZoom = z;
  if (on) { map.dragging.disable(); if (me) map.setView(me.getLatLng(), Math.max(map.getZoom(), 16)); }
  else map.dragging.enable();
}
document.addEventListener("visibilitychange", () => { if (wid !== null && document.visibilityState === "visible") wake(); });

// ---------- 共有URLから開いたとき ----------
function loadHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get("r")) return;
  try {
    showRoute({ route: decPoly(h.get("r")), ok: h.get("ok") ? decPoly(h.get("ok")) : [], ng: h.get("ng") ? decPoly(h.get("ng")) : [], name: "共有されたルート" }, true);
    $("bNew").style.display = ""; $("panel").classList.add("min"); $("tog").textContent = "ひらく";
  } catch (e) { setMsg("共有URLが読めませんでした", true); }
}
window.addEventListener("hashchange", loadHash);

// ---------- ルートの保存（この端末のブラウザの中に） ----------
const RKEY = "hosomichi_routes", LKEY = "hosomichi_last";
function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { alert("保存できませんでした（容量がいっぱいかも）"); return false; } }
function packRoute(r) {
  return { name: r.name || "", created: r.created || Date.now(), r: encPoly(simplify(r.route, 1)),
    s: r.short ? encPoly(simplify(r.short, 3)) : "", ok: encPoly(r.ok || []), ng: encPoly(r.ng || []),
    len: r.len, slen: r.slen || 0, kinds: r.kinds || null };
}
function unpackRoute(o) {
  return { name: o.name, created: o.created, route: decPoly(o.r), short: o.s ? decPoly(o.s) : null,
    ok: decPoly(o.ok || ""), ng: decPoly(o.ng || ""), len: o.len, slen: o.slen, kinds: o.kinds };
}
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function renderList() {
  const rs = lsGet(RKEY, []);
  $("nSaved").textContent = rs.length;
  $("list").innerHTML = rs.length ? rs.slice().sort((a, b) => b.created - a.created).map(o =>
    `<div class="it" data-id="${o.id}"><div class="nm" data-a="open"><b>${esc(o.name || "名前なし")}</b>` +
    `<small>${fmtKm(o.len)}・${new Date(o.created).toLocaleDateString("ja-JP")}</small></div>` +
    `<button data-a="ren">名前</button><button data-a="del">🗑</button></div>`).join("")
    : '<div style="font-size:12px;color:#888;padding:6px">まだないよ。ルートを作って「💾 保存」してね</div>';
}
$("bList").onclick = () => { const l = $("list"); l.style.display = l.style.display === "block" ? "none" : "block"; renderList(); };
$("list").onclick = ev => {
  const a = ev.target.closest("[data-a]")?.dataset.a, it = ev.target.closest(".it"); if (!a || !it) return;
  const rs = lsGet(RKEY, []), i = rs.findIndex(o => String(o.id) === it.dataset.id); if (i < 0) return;
  if (a === "open") {
    showRoute({ ...unpackRoute(rs[i]), savedId: rs[i].id }, true);
    $("bNew").style.display = ""; setMsg(`「${rs[i].name}」を開いたよ`);
    $("list").style.display = "none";
  } else if (a === "ren") {
    const n = prompt("ルートの名前", rs[i].name); if (n == null) return;
    rs[i].name = n.trim() || rs[i].name; lsSet(RKEY, rs); renderList();
  } else if (a === "del") {
    if (!confirm(`「${rs[i].name}」を消す？`)) return;
    rs.splice(i, 1); lsSet(RKEY, rs); renderList();
    if (cur && String(cur.savedId) === it.dataset.id) { cur.savedId = null; updSaveBtn(); }
  }
};
function updSaveBtn() { $("bSave").textContent = cur && cur.savedId ? "💾 保存ずみ ✓" : "💾 保存"; }
$("bSave").onclick = () => {
  if (!cur) return;
  const rs = lsGet(RKEY, []);
  const old = cur.savedId ? rs.find(o => o.id === cur.savedId) : null;
  const n = prompt(old ? "名前を変えて上書き保存するよ" : "ルートの名前をつけてね", cur.name || "");
  if (n == null) return;
  cur.name = n.trim() || cur.name || "名前なし";
  if (old) Object.assign(old, packRoute(cur), { id: old.id, created: old.created });
  else { cur.savedId = Date.now(); rs.push({ ...packRoute(cur), id: cur.savedId, created: Date.now() }); }
  if (lsSet(RKEY, rs)) { updSaveBtn(); renderList(); }
};
renderList();

// ---------- 開いたとき：共有URL → なければ前回のルート ----------
if (location.hash.includes("r=")) loadHash();
else {
  const last = lsGet(LKEY, null);
  if (last) { try { showRoute(unpackRoute(last), true); setMsg("前回のルートを表示してるよ"); $("bNew").style.display = ""; } catch {} }
}
</script>
</body></html>
