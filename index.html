<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d93025">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="細道ナビ">
<title>細道ルートナビ hosomichi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.5.3/dist/leaflet-rotate.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#map{position:absolute;inset:0}
:root{--ptop:90px}
/* 画面の下には何も置かない（Chrome の「タブを閉じました」などが10秒くらい出てタッチできないため）
   ボタンは右のまんなか、「のこり」や色の説明はパネルのすぐ下 */
#panel{position:absolute;top:8px;left:8px;right:8px;max-width:440px;z-index:1100;background:#fff;border-radius:12px;
  box-shadow:0 2px 10px #0004;padding:10px 12px;font-size:15px}
#panel.min .body{display:none}
#mini{display:none;font-weight:normal;font-size:11px;color:#d93025;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel.min #mini{display:block}
#panel.min #msg{display:none}              /* たたんでいるときはゲージだけ */
#panel.min #prog{margin-top:6px}
#bar.done div{background:#188038}
#bar.run{background:repeating-linear-gradient(-45deg,#eee 0 8px,#f8f8f8 8px 16px);background-size:200% 100%;animation:run 1s linear infinite}
@keyframes run{from{background-position:0 0}to{background-position:-22px 0}}
#head{display:flex;align-items:center;gap:8px;font-weight:bold}
#head .t{flex:1;min-width:0}
#tog{border:none;background:#eee;border-radius:8px;padding:4px 10px;font-size:14px}
#stop{border:none;background:#fdecea;color:#d93025;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:bold;white-space:nowrap}
#fs{border:none;background:#eee;border-radius:8px;padding:4px 10px;font-size:16px;line-height:1.2;display:none}
.row{display:flex;gap:6px;margin-top:8px;align-items:center}
.row label{width:3.2em;font-size:13px;color:#555}
.row input[type=text]{flex:1;min-width:0;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.ib{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 10px;font-size:15px}
#go{width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px;background:#d93025;color:#fff;font-size:17px;font-weight:bold}
#go:disabled{background:#999}
.pre{display:flex;gap:6px;margin-top:8px}
.pre button{flex:1;padding:8px 4px;border:1px solid #ccc;background:#fff;border-radius:8px;font-size:13px}
.pre button.on{border-color:#d93025;background:#fdecea;color:#d93025;font-weight:bold}
.tabs{display:flex;gap:4px;margin-top:8px;border-bottom:2px solid #eee}
.tabs button{flex:1;border:none;background:none;padding:6px;font-size:14px;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:#d93025;border-bottom-color:#d93025;font-weight:bold}
#logN{font-size:11px;color:#999;font-weight:normal}
#log{height:55vh;overflow:auto;background:#1e1e1e;color:#ddd;border-radius:8px;padding:6px 8px;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
#log .w{color:#ffb74d} #log .e{color:#ff6e6e;font-weight:bold} #log .ok{color:#81c784} #log .h{color:#64b5f6;font-weight:bold} #log .m{color:#ce93d8}
#log time{color:#777;margin-right:6px}
#ask .q{background:#fff;border-radius:12px;padding:16px;max-width:360px;width:100%;font-size:14px;line-height:1.6;box-shadow:0 4px 16px #0006}
#ask .btns{display:flex;gap:6px}#ask .btns button{flex:1}
#upd button{margin-left:8px;border:none;border-radius:6px;padding:4px 10px;background:#fff;color:#188038;font-weight:bold}
#cfgBox{margin-top:8px;background:#f7f7f7;border-radius:8px;padding:6px 8px;max-height:62vh;overflow:auto}
#cfgBox h4{margin:8px 0 2px;font-size:12px;color:#d93025}
#cfgBox .c{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
#cfgBox .c span{flex:1}
#cfgBox select{font-size:13px;padding:3px;border-radius:6px;border:1px solid #ccc;max-width:58%}
#cfgBox .note{font-size:11px;color:#888}
#prog{margin-top:8px;display:none}
#bar{height:10px;background:#eee;border-radius:4px;overflow:hidden}
#bar div{height:100%;width:0;background:#d93025;transition:width .4s}
#bar.busy div{width:30%!important;animation:busy 1.2s infinite linear}
@keyframes busy{from{margin-left:-30%}to{margin-left:100%}}
#msg{font-size:12px;color:#555;margin-top:4px;white-space:pre-wrap}
#msg.err{color:#c00}
#result{display:none;margin-top:8px;font-size:13px;line-height:1.5}
#result .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#result .btns button{flex:1}
#list{display:none;max-height:40vh;overflow:auto;margin-top:6px}
#list .it{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px solid #eee;font-size:13px}
#list .it .nm{flex:1;min-width:0;cursor:pointer}
#list .it .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .it .nm small{color:#888}
#list .it button{border:1px solid #ccc;background:#fff;border-radius:6px;padding:4px 8px;font-size:13px}
#share{display:none;margin-top:8px;font-size:13px;background:#f6f6f6;border-radius:8px;padding:8px}
#share textarea{width:100%;height:60px;font-size:11px}
#gps{position:absolute;top:calc(50% + 60px);right:12px;z-index:1000;width:60px;height:60px;border-radius:50%;
  border:none;background:#fff;box-shadow:0 2px 8px #0005;font-size:28px;line-height:60px;text-align:center}
#gps.on{background:#1a73e8;color:#fff}
#dir{position:absolute;top:calc(50% - 10px);right:18px;z-index:1000;width:48px;height:48px;border-radius:50%;
  border:none;background:#fff;box-shadow:0 2px 8px #0005;padding:0;display:none}
#dir.on{background:#1a73e8}
#lay{position:absolute;top:calc(50% - 82px);right:18px;z-index:1000;width:48px;height:48px;border-radius:50%;
  border:none;background:#fff;box-shadow:0 2px 8px #0005;font-size:22px;padding:0}
#col{position:absolute;top:calc(50% - 154px);right:18px;z-index:1000;width:48px;height:48px;border-radius:50%;
  border:none;background:#fff;box-shadow:0 2px 8px #0005;font-size:22px;padding:0}
#col small{position:absolute;right:0;bottom:-16px;font-size:10px;color:#333;text-shadow:0 0 3px #fff;white-space:nowrap}
#legend{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));pointer-events:none;z-index:999;background:#fffe;border-radius:10px;
  box-shadow:0 2px 8px #0003;padding:6px 8px;font-size:11px;line-height:1.6;display:none;max-width:60%}
#legend i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:4px;vertical-align:middle}
#lay small{position:absolute;right:0;bottom:-16px;font-size:10px;color:#333;text-shadow:0 0 3px #fff;white-space:nowrap}
.leaflet-bottom.leaflet-right{bottom:0}
#dir svg{display:block;margin:auto;transition:transform .3s}
#dir small{position:absolute;right:0;bottom:-16px;text-align:right;font-size:10px;color:#333;text-shadow:0 0 3px #fff;white-space:nowrap}
.me-ic svg{display:block}
#nav{position:absolute;top:calc(var(--ptop) + 8px);left:10px;right:84px;z-index:1000;background:#fffe;border-radius:12px;
  box-shadow:0 2px 8px #0004;padding:8px 12px;font-size:18px;font-weight:bold;display:none}
#nav.off{color:#c00}
.pin{font-size:13px}
.pin button{margin:4px 2px 0;padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#fff}
.leaflet-control-attribution{font-size:10px;pointer-events:none}
</style></head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="head"><span class="t">🚲 細道ルートナビ <small id="ver" style="font-weight:normal;font-size:11px;color:#999">v1110.0004</small><small id="mini"></small></span><button id="stop" title="計算を止める" style="display:none">■ 止める</button><button id="fs" title="全画面">⛶</button><button id="tog">たたむ</button></div>
  <div id="prog"><div id="bar"><div></div></div><div id="msg"></div></div>   <!-- ゲージはどのタブでも見える -->

    <div class="tabs"><button data-t="route" class="on">🚲 ルート</button><button data-t="cfg">⚙ 設定</button><button data-t="log">📜 ログ <span id="logN"></span></button></div>

    <div class="row"><label>到着</label><input type="text" id="to" enterkeyhint="go" placeholder="駅名・住所・GoogleマップURL"></div>
    <div class="pre" id="pre"><button data-p="near">近道</button><button data-p="std">おすすめ</button><button data-p="hoso">細道こだわり</button><button data-p="cfg">⚙ 設定</button></div>
    <div class="row" style="margin-top:6px"><label style="width:auto">地図の広さ</label>
      <select id="areaSel" style="flex:1;padding:6px;border-radius:8px;border:1px solid #ccc;font-size:13px">
        <option value="narrow">せまい（早い）</option><option value="normal">ふつう</option><option value="wide">ひろい（おそい）</option></select></div>

      <button id="bClear" style="font-size:11px;border:1px solid #ccc;background:#fff;border-radius:6px;padding:1px 6px;margin-left:4px">消す</button></div>

      <div class="btns">
        <button class="ib" id="bSave">💾 保存</button>

        <button class="ib" id="bGpx">⬇ GPX</button>

        <button class="ib" id="bResume" style="display:none;flex-basis:100%;border-color:#188038;color:#188038;font-weight:bold">▶ 続きを計算</button>

      <div id="share">
        <div>出発地のまわりを隠す
          <select id="hide"><option value="0">隠さない</option><option value="200">200m</option>
          <option value="400" selected>400m</option><option value="800">800m</option></select>
          <label><input type="checkbox" id="hideEnd"> 到着地も</label></div>
        <div id="homeNote" style="margin:6px 0;padding:6px 8px;border-radius:6px;background:#fff3e0;color:#b45309;font-weight:bold"></div>
        <div class="row" style="margin-top:4px"><label style="width:auto">名前</label><input type="text" id="shareName" maxlength="40" placeholder="ルートの名前（いっしょに送るよ）"></div>
        <textarea id="url" readonly></textarea>
        <div class="btns"><button class="ib" id="bQr">📷 QR</button><button class="ib" id="bCopy">コピー</button><button class="ib" id="bSys">共有…</button></div>

      </div>
    </div>
    </div>
  </div>
</div>
<div id="nav"></div>
<div id="ask" style="display:none;position:fixed;inset:0;z-index:2500;background:#0006;align-items:center;justify-content:center;padding:16px"></div>
<div id="upd" style="display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2000;background:#188038;color:#fff;
  border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 2px 8px #0005;white-space:nowrap"></div>
<div id="inapp" style="display:none;position:absolute;left:8px;right:8px;top:calc(var(--ptop) + 8px);z-index:1001;background:#333;color:#fff;
  border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5">📱 X などのアプリの中で開いてるよ。現在地ナビを使うときは「︙」→「ブラウザで開く」で Chrome や Safari で開いてね
  <button onclick="this.parentNode.remove()" style="float:right;margin-left:8px;border:none;background:#555;color:#fff;border-radius:6px;padding:2px 8px">とじる</button></div>
<button id="gps" title="現在地についていく">◎</button>
<button id="lay" title="地図の種類">🗺<small id="layL"></small></button>
<button id="col" title="ルートの色">🎨<small id="colL"></small></button>
<div id="legend"></div>
<div id="qr" style="display:none;position:fixed;inset:0;z-index:3000;background:#fff;overflow:auto;text-align:center;padding:12px"></div>
<button id="dir" title="地図の向き"><svg id="needle" width="30" height="30" viewBox="0 0 30 30"><polygon points="15,2 20,15 10,15" fill="#d93025"/><polygon points="15,28 20,15 10,15" fill="#999"/><text x="15" y="13" font-size="7" text-anchor="middle" fill="#fff" font-weight="bold">N</text></svg><small id="dirL">北が上</small></button>

<script id="router" type="text/plain">// ==== 細道ルート計算エンジン（Web Worker / Node 両用） ====
// 設定（cfg）はページ側から渡される。DEFAULT_CFG がおすすめ値
const DEFAULT_CFG = {
  pen: {                 // 1m を何m分と数えるか（大きいほど避ける）。"no" は通らない
    living_street: 1, residential: 1, service: 1.2, unclassified: 1.2, cycleway: 1,
    tertiary: 3, secondary: 5, primary: 8, trunk: 30,
    footway: 2, pedestrian: 1.5, path: 1.5, track: 1.5,
  },
  steps: "no",           // 階段: "no"=通らない / "ramp"=自転車スロープ付きなら / "yes"=通る
  bridge: 3,             // 歩道橋・地下道（歩行者用）: 倍率 or "no"
  unpaved: 20,           // 砂利・土の道: 倍率 or "no"（1=気にしない）
  wideCross: "signal",   // 4車線以上の横断: "signal" / "crosswalk" / "any"
  midCross: "prefer",    // 2車線の道の横断: "must" / "prefer" / "any"
};
const BASE = { tertiary_link: "tertiary", secondary_link: "secondary", primary_link: "primary", trunk_link: "trunk" };
const OTHER_PENALTY = 2.0;
const EXCLUDE = new Set(["motorway", "motorway_link", "construction", "proposed", "raceway", "bus_guideway",
  "elevator", "corridor", "platform", "bus_stop"]);
const UNPAVED = new Set(["gravel", "fine_gravel", "pebblestone", "unpaved", "dirt", "earth", "ground", "grass",
  "sand", "mud", "compacted", "woodchips", "rock", "grass_paver"]);
const SIGNAL_RADIUS = 35, CROSSWALK_RADIUS = 20;
const HARD = 3000, SOFT = 500;    // 横断ルールを守れないときの追加コスト(m相当)
const MID_ROADS = new Set(["tertiary", "secondary", "primary", "trunk"]);
const FOOTLIKE = new Set(["footway", "pedestrian", "path", "steps"]);
const KIND_JA = {
  living_street: "生活道路", residential: "住宅街の道", service: "私道・通路", unclassified: "細めの一般道",
  track: "農道", path: "小道", cycleway: "自転車道", pedestrian: "歩行者道", footway: "歩道",
  tertiary: "一般道", secondary: "県道クラス", primary: "国道・主要道", trunk: "幹線国道", steps: "階段", road: "道",
};
const OVERPASS_URLS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];

function lanesOf(t) { const n = parseInt(String(t.lanes || "0").split(";")[0]); return isNaN(n) ? 0 : n; }
function isOneway(t) { return ["yes", "1", "true", "-1"].includes(t.oneway); }
function isWide(t) {
  const hw = t.highway || "", n = lanesOf(t), ow = isOneway(t);
  if (n >= 4) return true;
  if ((hw === "trunk" || hw === "trunk_link") && n !== 2 && !(ow && n === 1)) return true;
  if (["trunk", "primary", "secondary"].includes(hw) && ow && n >= 2) return true;
  return false;
}
// 横断のときの道の格: 2=4車線以上 / 1=2車線の道（一般道以上 or 2車線） / 0=細い道
function levelOf(t) {
  if (isWide(t)) return 2;
  const b = BASE[t.highway] || t.highway;
  if (MID_ROADS.has(b) || lanesOf(t) >= 2) return 1;
  return 0;
}
function isUnpaved(t) {
  const sf = t.surface || "";
  if (UNPAVED.has(sf) || ["grade3", "grade4", "grade5"].includes(t.tracktype)) return "sure";
  if (!sf && (t.highway === "track" || t.highway === "path") && t.tracktype !== "grade1") return "maybe";
  return null;
}
const yes = v => v && v !== "no";
// 道1本の倍率と表示名。通らないなら null
function wayCost(t, cfg) {
  const hw = t.highway, b = BASE[hw] || hw;
  let p, name = KIND_JA[b] || b;
  if (hw === "steps") {
    if (cfg.steps === "no") return null;
    if (cfg.steps === "ramp" && t["ramp:bicycle"] !== "yes") return null;
    p = cfg.steps === "ramp" ? 8 : 5;
    name = cfg.steps === "ramp" ? "自転車スロープ付き階段" : "階段";
  } else {
    p = cfg.pen[b] ?? OTHER_PENALTY;
    if (p === "no") return null;
    if (lanesOf(t) >= 2 && p > 1) p *= 1.5;
  }
  if (FOOTLIKE.has(hw) && (yes(t.bridge) || yes(t.tunnel))) {
    if (cfg.bridge === "no") return null;
    p *= cfg.bridge; name = yes(t.bridge) ? "歩道橋" : "地下道";
  }
  const u = isUnpaved(t);
  if (u) {
    if (u === "sure" && cfg.unpaved === "no") return null;
    const m = cfg.unpaved === "no" ? 20 : cfg.unpaved;
    p *= u === "sure" ? m : Math.max(1, Math.sqrt(m));
    name = u === "sure" ? "砂利・土の道" : "舗装不明の小道";
  }
  return [p, name];
}
const R = 6371000, RAD = Math.PI / 180;
function hav(la1, lo1, la2, lo2) {
  const a = Math.sin((la2 - la1) * RAD / 2) ** 2 + Math.cos(la1 * RAD) * Math.cos(la2 * RAD) * Math.sin((lo2 - lo1) * RAD / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function overpassQuery(b) {
  return `[out:json][timeout:40];
way["highway"]["highway"!~"^(motorway|motorway_link|construction|proposed|platform|corridor|elevator|raceway|bus_guideway|bus_stop)$"]["access"!~"^(no|private)$"]["service"!~"^(parking_aisle|drive-through)$"](${b.s},${b.w},${b.n},${b.e});
(._;>;);
out body qt;`;
}

// ==== ログ（ページの「ログ」タブに出す） ====
let logFn = null;
function log(msg, lv = "i") { if (logFn) logFn({ t: Date.now(), lv, msg }); }
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(2) + "MB" : (n / 1024).toFixed(0) + "KB";

// ==== 途中で止める ====
let stopReq = false;
const stopWaiters = new Set();   // 道路データ待ちをしている所を、止めたときに起こす
const aborts = new Set();
class StopError extends Error { constructor() { super("止めたよ"); this.stopped = true; } }
const checkStop = () => { if (stopReq) throw new StopError(); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 1マスの取得。8秒返事がなければ次のサーバーにも同時にたのみ（かけもち）、早く返ってきた方を使う
const HEDGE_MS = 8000, TRY_TIMEOUT = 45000;
let cancelFetch = false;   // ルートができた後など、もういらない取得をやめる
async function fetchOSM(b, prog, start = 0, quick = false, tag = "") {
  const body = "data=" + encodeURIComponent(overpassQuery(b));
  const urls = OVERPASS_URLS.map((_, i) => OVERPASS_URLS[(i + start) % OVERPASS_URLS.length]);
  let last;
  const race = () => new Promise(resolve => {
    let next = 0, failed = 0, finished = false, hedge = null;
    const acs = [];
    const finish = v => { if (finished) return; finished = true; clearTimeout(hedge); for (const a of acs) { a.abort(); aborts.delete(a); } resolve(v); };
    const launch = () => {
      if (finished || next >= urls.length) return;
      const url = urls[next++], host = new URL(url).host, ac = new AbortController(), tq = Date.now();
      acs.push(ac); aborts.add(ac);
      log(`取得開始 [${tag}] → ${host}${quick ? "（予備データあり）" : ""}`);
      prog({ msg: `${host} サーバーが計算中`, done: 0, total: 0 });
      const to = setTimeout(() => { ac.timedOut = true; ac.abort(); }, TRY_TIMEOUT);
      clearTimeout(hedge);
      hedge = setTimeout(() => { if (!finished && next < urls.length) { log(`  ${HEDGE_MS / 1000}秒返事がないので、次のサーバーにも同時にたのむ [${tag}]`); launch(); } }, HEDGE_MS);
      (async () => {
        try {
          const res = await fetch(url, { method: "POST", body, signal: ac.signal, headers: { "Content-Type": "application/x-www-form-urlencoded" } });
          if (!res.ok) throw new Error("HTTP " + res.status);
          log(`  返事あり [${tag}] ${host} HTTP ${res.status}（${((Date.now() - tq) / 1000).toFixed(1)}秒）`);
          const total = +res.headers.get("Content-Length") || 0;
          const reader = res.body.getReader(), chunks = []; let done = 0;
          for (;;) {
            const { value, done: fin } = await reader.read();
            if (fin) break;
            chunks.push(value); done += value.length;
            prog({ msg: `${host} ダウンロード中`, done, total });
          }
          const buf = new Uint8Array(done); let o = 0;
          for (const c of chunks) { buf.set(c, o); o += c.length; }
          const text = new TextDecoder().decode(buf), json = JSON.parse(text);
          if (json.remark && /error|timed out|memory/i.test(json.remark)) throw new Error(json.remark.slice(0, 80));
          if (finished) return;
          const nw = json.elements.filter(e => e.type === "way").length;
          log(`  取得OK [${tag}] ${host} ${kb(done)}・道 ${nw}本・点 ${json.elements.length - nw}個（合計 ${((Date.now() - tq) / 1000).toFixed(1)}秒）`, "ok");
          finish({ json, text });
        } catch (e) {
          if (finished) return;
          if (stopReq || cancelFetch) return finish(null);
          last = e; failed++;
          prog({ msg: `${host} 失敗: ${e.message}`, warn: true });
          log(`  失敗 [${tag}] ${host}: ${ac.timedOut ? `時間切れ(${TRY_TIMEOUT / 1000}秒)` : e.name === "AbortError" ? "中止" : e.message}`, "w");
          if (failed >= urls.length) finish(null); else if (next < urls.length && failed >= next) launch();
        } finally { clearTimeout(to); aborts.delete(ac); }
      })();
    };
    launch();
  });
  // サーバーが混んでいる（502/504/429 など）ときは、だんだん長く待ちながら何回かやりなおす
  const WAITS = [10, 20, 40, 60, 90];
  for (let round = 0; round <= (quick ? 0 : WAITS.length); round++) {   // quick：予備の古いデータがあるので1周だけ
    checkStop(); if (cancelFetch) throw new StopError();
    const r = await race();
    checkStop(); if (cancelFetch) throw new StopError();
    if (r) return r;
    if (!quick && round < WAITS.length) {
      log(`全サーバー失敗 [${tag}]。${WAITS[round]}秒待ってやりなおし（${round + 1}/${WAITS.length}）`, "w");
      for (let sec = WAITS[round]; sec > 0; sec--) {
        prog({ msg: `サーバーが混んでるみたい（${last?.message || ""}）。${sec}秒後にもう一度ためすよ（${round + 1}/${WAITS.length}回目）` });
        await sleep(1000); checkStop(); if (cancelFetch) throw new StopError();
      }
    }
  }
  log(`取得あきらめ [${tag}]: ${last?.message || ""}`, "e");
  throw new Error("OSMのデータが取れませんでした（" + (last?.message || "") + "）。サーバーが混んでるみたい。しばらくしてから「▶ 続きを計算」でためしてね");
}

function buildGraph(osm, cfg, onProg) {
  cfg = { ...DEFAULT_CFG, ...cfg, pen: { ...DEFAULT_CFG.pen, ...(cfg && cfg.pen) } };
  const idx = new Map(), lat = [], lon = [], ntags = new Map(), ids = [];
  for (const e of osm.elements) if (e.type === "node") {
    idx.set(e.id, lat.length); ids.push(e.id); if (e.tags) ntags.set(lat.length, e.tags); lat.push(e.lat); lon.push(e.lon);
  }
  const N = lat.length, adj = Array.from({ length: N }, () => []);
  const lvl = new Uint8Array(N), inGraph = new Uint8Array(N);
  const d = (u, v) => hav(lat[u], lon[u], lat[v], lon[v]);
  const NE = osm.elements.length; let ei = 0;
  const mainWays = [];
  for (const e of osm.elements) {
    if (onProg && (++ei & 0x3fff) === 0) onProg(ei / NE * 0.9);
    if (e.type !== "way") continue;
    const t = e.tags || {}, hw = t.highway;
    if (!hw || EXCLUDE.has(hw)) continue;
    if (t.access === "no" || t.access === "private" || t.bicycle === "no") continue;
    const nd = e.nodes.map(id => idx.get(id)).filter(x => x !== undefined);
    if (nd.length < 2) continue;
    const L0 = levelOf(t);
    if (L0) { mainWays.push([nd, L0]); for (const i of nd) if (L0 > lvl[i]) lvl[i] = L0; }   // 通らない道でも「横断する道」としては数える
    const wc = wayCost(t, cfg);
    if (!wc) continue;
    let [pen, name] = wc;
    if (["footway", "path", "pedestrian", "cycleway", "track"].includes(hw) && nd.some(i => ntags.get(i)?.railway === "crossing")) {
      let wl = 0; for (let i = 1; i < nd.length; i++) wl += d(nd[i - 1], nd[i]);
      if (wl < 200) { pen = 1.0; name = "歩行者・自転車用踏切"; }
    }
    let ow = t.oneway; if (t["oneway:bicycle"] === "no") ow = "no";
    const fwd = ow !== "-1", back = !["yes", "1", "true"].includes(ow);
    for (let i = 1; i < nd.length; i++) {
      const u = nd[i - 1], v = nd[i], L = d(u, v);
      inGraph[u] = 1; inGraph[v] = 1;
      if (fwd) adj[u].push({ v, c: L * pen, L, l: L0, k: name, w: e.id });
      if (back) adj[v].push({ v: u, c: L * pen, L, l: L0, k: name, w: e.id });
    }
  }
  // 大きい道の向き（横断かどうか＝道の反対側に出るかを判定するため）
  const dirX = new Float32Array(N), dirY = new Float32Array(N);
  const cosl = Math.cos((lat[0] || 35) * RAD);
  for (const [nd, L0] of mainWays) for (let k = 0; k < nd.length; k++) {
    const i = nd[k]; if (lvl[i] !== L0 || dirX[i] || dirY[i]) continue;
    const a = nd[Math.max(0, k - 1)], b = nd[Math.min(nd.length - 1, k + 1)];
    dirX[i] = (lon[b] - lon[a]) * cosl * 111320; dirY[i] = (lat[b] - lat[a]) * 111320;
  }
  // 信号・横断歩道の場所
  const mkGrid = () => new Map();
  const gSig = mkGrid(), gXw = mkGrid();
  const put = (g, i) => { const k = Math.round(lat[i] * 2000) + "," + Math.round(lon[i] * 2000); if (!g.has(k)) g.set(k, []); g.get(k).push(i); };
  for (const [i, t] of ntags) {
    if (t.highway === "traffic_signals" || t.crossing === "traffic_signals" || t["crossing:signals"] === "yes") put(gSig, i);
    else if (t.highway === "crossing" && !["no", "unmarked", "informal"].includes(t.crossing)) put(gXw, i);
  }
  const near = (g, i, r) => {
    const a = Math.round(lat[i] * 2000), b = Math.round(lon[i] * 2000);
    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++)
      for (const j of g.get((a + x) + "," + (b + y)) || []) if (d(i, j) <= r) return true;
    return false;
  };
  // 横断の追加コスト（その点で lvl の道を横切るとき）と種類 1=信号 2=横断歩道 3=なし
  const xcost = new Float32Array(N), xkind = new Uint8Array(N);
  let nNodes = 0;
  for (let i = 0; i < N; i++) {
    if (inGraph[i]) nNodes++;
    if (!lvl[i] || !inGraph[i]) continue;
    const sig = near(gSig, i, SIGNAL_RADIUS), xw = near(gXw, i, CROSSWALK_RADIUS);
    xkind[i] = sig ? 1 : xw ? 2 : 3;
    if (lvl[i] === 2) xcost[i] = cfg.wideCross === "any" ? 0 : sig ? 0 : (cfg.wideCross === "crosswalk" && xw) ? 0 : HARD;
    else xcost[i] = cfg.midCross === "any" || sig || xw ? 0 : cfg.midCross === "must" ? HARD : SOFT;
  }
  return { lat, lon, adj, lvl, xcost, xkind, inGraph, nNodes, cfg, dirX, dirY, cosl, idx, ids, turn: +(cfg.turn || 0) };
}

// 道の「つながりのかたまり」。駅の中の通路や公園の中の小道など、外とつながってない所を見分ける
function components(G) {
  if (G.comp) return G.comp;
  const N = G.lat.length, par = new Int32Array(N);
  for (let i = 0; i < N; i++) par[i] = i;
  const f = x => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
  for (let u = 0; u < N; u++) for (const e of G.adj[u]) { const a = f(u), b = f(e.v); if (a !== b) par[a] = b; }
  const root = new Int32Array(N), size = new Map();
  for (let i = 0; i < N; i++) if (G.inGraph[i]) { root[i] = f(i); size.set(root[i], (size.get(root[i]) || 0) + 1); }
  let big = 0; for (const v of size.values()) big = Math.max(big, v);
  return (G.comp = { root, size, big });
}
// 近い点をえらぶ：ちゃんと外の道とつながっている点（大きいかたまり）だけ
function nearestGood(G, la, lo, sameAs = -1) {
  const C = components(G), min = Math.min(C.big, Math.max(30, C.big * 0.05));
  let best = -1, bd = Infinity, any = -1, ad = Infinity;
  for (let i = 0; i < G.lat.length; i++) {
    if (!G.inGraph[i]) continue;
    const d = hav(la, lo, G.lat[i], G.lon[i]);
    if (d < ad) { ad = d; any = i; }
    const ok = sameAs >= 0 ? C.root[i] === C.root[sameAs] : C.size.get(C.root[i]) >= min;
    if (ok && d < bd) { bd = d; best = i; }
  }
  return { n: best, d: bd, nearestAny: any, dAny: ad, size: best >= 0 ? C.size.get(C.root[best]) : 0, anySize: any >= 0 ? C.size.get(C.root[any]) : 0 };
}

function nearest(G, la, lo) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < G.lat.length; i++) {
    if (!G.inGraph[i]) continue;
    const dd = hav(la, lo, G.lat[i], G.lon[i]);
    if (dd < bd) { bd = dd; best = i; }
  }
  return [best, bd];
}

class Heap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(k, v) {
    const K = this.k, V = this.v; let i = K.length; K.push(k); V.push(v);
    while (i > 0) { const p = (i - 1) >> 1; if (K[p] <= k) break; K[i] = K[p]; V[i] = V[p]; i = p; }
    K[i] = k; V[i] = v;
  }
  pop() {
    const K = this.k, V = this.v, rk = K[0], rv = V[0], lk = K.pop(), lv = V.pop(), n = K.length;
    if (n) {
      let i = 0;
      for (;;) {
        let c = 2 * i + 1; if (c >= n) break;
        if (c + 1 < n && K[c + 1] < K[c]) c++;
        if (K[c] >= lk) break;
        K[i] = K[c]; V[i] = V[c]; i = c;
      }
      K[i] = lk; V[i] = lv;
    }
    return [rk, rv];
  }
}

// A*：ゴールまでのまっすぐな距離を見こみに足して、ゴールの方向から先に調べる（はやい）
// 状態 = (点, 入ってきた道の格)。格の低い道 → 格の高い道の点 → 格の低い道 と抜けたら「横断」
// g<0 のときはゴールが範囲の外：調べられるところまで全部調べる（途中までのルート用）
function search(G, s, g, gll, useLen, onProg) {
  const N = G.lat.length, best = new Float64Array(N * 3).fill(Infinity), prev = new Int32Array(N * 3).fill(-1);
  const glat = gll[0], glon = gll[1], kx = Math.cos(glat * RAD) * 111320 * 0.995, ky = 111320 * 0.995;
  const H = i => Math.hypot((G.lon[i] - glon) * kx, (G.lat[i] - glat) * ky);
  const closed = new Uint8Array(N * 3), inWay = new Float64Array(N * 3).fill(-1);  // その状態に入ってきた道
  const h = new Heap(); best[s * 3] = 0; h.push(H(s), s * 3);
  let goal = -1, pops = 0, far = 0;
  const D0 = H(s) || 1;
  while (h.size) {
    const st = h.pop()[1];
    if (closed[st]) continue;
    closed[st] = 1;
    const c = best[st];
    const u = (st / 3) | 0, ul = st % 3;
    if ((++pops & 0x7fff) === 0 && onProg) {
      far = Math.max(far, 1 - H(u) / D0);
      onProg(Math.min(0.99, Math.max(0, far)));
    }
    if (u === g) { goal = st; break; }
    const L = G.lvl[u], pu = prev[st] >= 0 ? (prev[st] / 3) | 0 : -1;
    const chk = !useLen && L > 0 && G.xcost[u] > 0 && pu >= 0;
    const tw = !useLen && G.turn > 0 && pu >= 0 ? inWay[st] : -1;
    for (const e of G.adj[u]) {
      let nc = c + (useLen ? e.L : e.c);
      if (chk && isCrossing(G, pu, u, e.v, ul, e.l, L)) nc += G.xcost[u];
      if (tw >= 0 && e.w !== tw && isTurn(G, pu, u, e.v)) nc += G.turn;   // 別の道へ曲がる
      const ns = e.v * 3 + e.l;
      if (nc < best[ns] && !closed[ns]) { best[ns] = nc; prev[ns] = st; inWay[ns] = e.w; h.push(nc + H(e.v), ns); }
    }
  }
  return { goal, best, prev, closed, H, pops };
}
function pathTo(prev, st) { const p = []; for (; st >= 0; st = prev[st]) p.push((st / 3) | 0); return p.reverse(); }
function dijkstra(G, s, g, useLen, onProg) {
  const r = search(G, s, g, [G.lat[g], G.lon[g]], useLen, onProg);
  if (r.goal < 0) throw new Error("ルートが見つかりませんでした（道がつながっていないか、設定で通れない道が多すぎるかも）");
  return pathTo(r.prev, r.goal);
}

// 大きい道(格L)の点 u で、p→u→v と進むのが「道を横切る」かどうか
// ・細い道→細い道：p と v が大きい道の反対側にある
// ・細い道→大きい道 / 大きい道→細い道：右折（左側通行なので反対車線を横切る）
function isCrossing(G, p, u, v, inL, outL, L) {
  if (inL >= L && outL >= L) return false;           // 大きい道をそのまま進む
  const X = i => [(G.lon[i] - G.lon[u]) * G.cosl * 111320, (G.lat[i] - G.lat[u]) * 111320];
  const [px, py] = X(p), [vx, vy] = X(v);
  if (inL < L && outL < L) {
    const dx = G.dirX[u], dy = G.dirY[u];
    if (!dx && !dy) return true;
    const a = dx * py - dy * px, b = dx * vy - dy * vx;
    return a * b < 0;                                  // 反対側に出る
  }
  // 曲がる向き：入ってきた向き (u-p) から出ていく向き (v-u)
  const ix = -px, iy = -py, cr = ix * vy - iy * vx, dt = ix * vx + iy * vy;
  return Math.atan2(cr, dt) < -0.5;                  // 約30°以上の右折
}

// p→u→v で、進む向きが40°以上かわるか（＝曲がる）
function isTurn(G, p, u, v) {
  const c = G.cosl;
  const ax = (G.lon[u] - G.lon[p]) * c, ay = G.lat[u] - G.lat[p], bx = (G.lon[v] - G.lon[u]) * c, by = G.lat[v] - G.lat[u];
  const ang = Math.abs(Math.atan2(ax * by - ay * bx, ax * bx + ay * by));
  return ang > 0.7;
}

function edge(G, u, v) {
  let best = null; for (const e of G.adj[u]) if (e.v === v && (!best || e.c < best.c)) best = e;
  return best;
}

function analyze(G, path) {
  const ok = [], xw = [], ng = [], ngIdx = [], kinds = {}, ek = []; let len = 0, turns = 0;
  for (let i = 1; i < path.length; i++) {
    const e = edge(G, path[i - 1], path[i]); len += e.L; kinds[e.k] = (kinds[e.k] || 0) + e.L; ek.push(e.k);
  }
  for (let i = 1; i < path.length - 1; i++) {
    if (edge(G, path[i - 1], path[i]).w !== edge(G, path[i], path[i + 1]).w && isTurn(G, path[i - 1], path[i], path[i + 1])) turns++;
    const u = path[i], L = G.lvl[u]; if (!L) continue;
    if (isCrossing(G, path[i - 1], u, path[i + 1], edge(G, path[i - 1], u).l, edge(G, u, path[i + 1]).l, L)) {
      const p = [G.lat[u], G.lon[u]], k = G.xkind[u];
      if (k === 1) ok.push(p); else if (k === 2) xw.push(p);
      else if (G.xcost[u] > 0 || L === 2) { ng.push(p); ngIdx.push(i); }   // ルール違反（または4車線を信号なし）
    }
  }
  return { ok, xw, ng, ngIdx, kinds, len, ek, turns };
}

// ==== タイル分割取得 ＋ 保存（メモリ ＋ IndexedDB） ====
// 範囲を TILE 度ごとのマスに分けて、1マスずつ取得・保存する
// マスの大きさ：近場は細かく（取る量を少なく）、遠い所は大きめ（問い合わせ回数を少なく）
const tileFor = (s, g) => hav(s[0], s[1], g[0], g[1]) <= 6000 ? 0.005 : 0.01;   // 約550m角 / 約1.1km角
const PARALLEL = 4;                // 同時に取るマスの数（サーバーを分けて並行で）
// 道路データはできるだけたくさん・長く（1年）とっておく
const DB_NAME = "hosomichi", STORE = "tiles", MAX_AGE = 365 * 864e5, MAX_TILES = 50000;
const mem = new Map();             // key -> elements
let dbp = null;
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise(ok => {
    if (typeof indexedDB === "undefined") return ok(null);
    try {
      const r = indexedDB.open(DB_NAME, 4);
      r.onupgradeneeded = () => {
        const db = r.result;   // 古い形式（大きいマス）は捨てて作りなおす
        for (const n of [...db.objectStoreNames]) db.deleteObjectStore(n);
        db.createObjectStore(STORE, { keyPath: "key" });
      };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ok(null);
    } catch { ok(null); }
  });
  return dbp;
}
function req(r) { return new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); }); }
async function store(mode) { const db = await openDB(); return db ? db.transaction(STORE, mode).objectStore(STORE) : null; }
async function pack(text) {
  // 長くたくさんとっておくので gzip でちぢめる（保存はルートを出したあとなので待たせない）
  if (typeof CompressionStream !== "undefined") {
    const s = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
    return { gz: true, blob: await new Response(s).blob() };
  }
  return { gz: false, blob: new Blob([text]) };
}
async function unpack(rec) {
  let s = rec.blob.stream();
  if (rec.gz) s = s.pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(s).text());
}
async function getTile(key) {
  try {
    const st = await store("readonly"); if (!st) return null;
    const r = await req(st.get(key));
    if (!r) return null;
    const el = (await unpack(r)).elements;
    return { el, stale: Date.now() - r.savedAt > MAX_AGE };   // 古くても、取れなかったときの予備に使う
  } catch { return null; }
}
async function putTile(key, text) {
  try {
    const { gz, blob } = await pack(text);
    const st = await store("readwrite"); if (!st) return;
    await req(st.put({ key, savedAt: Date.now(), gz, blob, size: blob.size }));
  } catch (e) { console.warn("保存できませんでした", e); }
}
async function prune() {
  try {
    const st = await store("readonly"); if (!st) return;
    const recs = (await req(st.getAll())).sort((a, b) => b.savedAt - a.savedAt);
    const now = Date.now(), del = recs.filter((r, i) => i >= MAX_TILES || now - r.savedAt > MAX_AGE * 3);
    if (del.length) { const w = await store("readwrite"); for (const r of del) await req(w.delete(r.key)); }
  } catch {}
}
async function stats() {
  const st = await store("readonly"); if (!st) return { n: 0, bytes: 0 };
  const recs = await req(st.getAll());
  return { n: recs.length, bytes: recs.reduce((a, r) => a + (r.size || 0), 0) };
}
async function clearAll() { const st = await store("readwrite"); if (st) await req(st.clear()); mem.clear(); }

// 出発→到着の線のまわり（帯）にかかるマスだけ選ぶ
function tilesFor(s, g, pad, TILE = tileFor(s, g)) {
  const c = Math.cos(s[0] * RAD);

// Google Polyline 形式（URLを短くするため）

}

    const [ax, ay] = P[a], [bx, by] = P[b], dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1e-9;
    for (let i = a + 1; i < b; i++) {

// ---------- 場所さがし ----------
function cleanAddr(t) {
  let a = t.normalize("NFKC");
  if (/\d\s*[‐－―ー−-]\s*\d/.test(a)) a = a.replace(/[‐－―ー−]/g, "-");
  a = a.replace(/〒?\s*\d{3}-\d{4}/, "").replace(/\s+/g, "");
  const m = a.match(/^.+?\d+丁目(?:\d+(?:番地|番|号|-)?)*/) || a.match(/^.+?\d+(?:-\d+)+/) || a.match(/^.+?\d+番地?(?:\d+号?)?/);

}
// Nominatim（OSMの住所さがし）は1秒に1回までのきまり。続けて呼ぶとことわられるので、順番に間をあけて呼ぶ
let nomiLast = 0, nomiChain = Promise.resolve();
function nomiFetch(url) {
  const run = nomiChain.then(async () => {
    const wait = nomiLast + 1100 - Date.now(); if (wait > 0) await new Promise(r => setTimeout(r, wait));
    nomiLast = Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res;
  });
  nomiChain = run.catch(() => {});
  return run;
}

// 「柏駅東口」「新宿駅南口」「品川駅 港南口」などの出口：まず駅をさがして、そのまわり500mで「東口」という名前の出口・バス停・広場をさがす

  const [st, stName] = await geocode(m[1]);        // 駅そのもの
  addLog(`出口さがし: 「${m[1]}」(${st[0].toFixed(5)},${st[1].toFixed(5)}) のまわりで「${word}」`, "m");
  const esc2 = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const q = `[out:json][timeout:15];(
    node(around:500,${st[0]},${st[1]})["name"~"${esc2}"];
    way(around:500,${st[0]},${st[1]})["name"~"${esc2}"];
    node(around:500,${st[0]},${st[1]})["railway"~"entrance"]["ref"~"${esc2.replace(/口$/, "")}"];
  );out center 40;`;

    try {

      clearTimeout(to);

  try {
    const r = await (await nomiFetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q=" + encodeURIComponent(m[1] + word))).json();

  addLog(`  「${word}」が見つからなかったので、駅の場所を使うよ`, "w");

async function geocode(text) {
  text = text.trim();
  if (EXIT_RE.test(text.normalize("NFKC")) && !/^https?:/.test(text)) { const r = await geocodeExit(text); if (r) return r; }

    if (m) return [[+m[1], +m[2]], "GoogleマップのURL"];

  }

  if (ll) return [[+ll[1], +ll[2]], "座標"];

    const q = cleanAddr(text);
    const r = await (await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q))).json();
    if (r.length) return [[r[0].geometry.coordinates[1], r[0].geometry.coordinates[0]], r[0].properties.title];
  };
  const nomi = async () => {
    const q = text.normalize("NFKC").replace(/〒?\s*\d{3}[-‐－―ー−]\d{4}/, "").trim();
    const r = await (await nomiFetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q=" + encodeURIComponent(q))).json();
    if (r.length) return [[+r[0].lat, +r[0].lon], r[0].display_name.split(",").slice(0, 3).join(",")];
  };
  const looksAddr = /丁目|番地|番|号|\d+\s*[-‐－―ー−]\s*\d+|[０-９]+[‐－―ー−][０-９]+/.test(text);
  for (const fn of looksAddr ? [gsi, nomi] : [nomi, gsi]) {
    try { const r = await fn(); if (r) return r; } catch (e) { console.warn(e); }
  }
  throw new Error(`「${text}」が見つかりませんでした。マンション名やお店の名前は見つからないことがあるよ。住所かGoogleマップのURLで入れてみてね`);
}

const CATS = [["細い道", "#188038"], ["自転車道", "#00acc1"], ["歩道・小道（押す所も）", "#8e24aa"], ["一般道・県道", "#f29900"],

function catOf(n) {

  if (/自転車道/.test(n)) return 1;
  if (/歩道橋|地下道|階段|踏切/.test(n)) return 5;
  if (/歩道|歩行者|小道$/.test(n) && !/舗装不明/.test(n)) return 2;
  if (/砂利|舗装不明|農道/.test(n)) return 6;

const SLOPES = [["のぼり 7%〜", "#d50000", 7], ["のぼり 4〜7%", "#fb8c00", 4], ["のぼり 2〜4%", "#fdd835", 2], ["ほぼ平ら", "#43a047", -3], ["くだり", "#29b6f6", -99]];

// 地理院の標高タイル（PNG）からルートの高さを調べる
const demCache = new Map();
async function demTile(z, x, y, kind) {
  const key = `${kind}/${z}/${x}/${y}`;
  if (demCache.has(key)) return demCache.get(key);
  const p = (async () => {
    const res = await fetch(`https://cyberjapandata.gsi.go.jp/xyz/${kind}/${z}/${x}/${y}.png`);
    if (!res.ok) return null;
    const bmp = await createImageBitmap(await res.blob());
    const cv = document.createElement("canvas"); cv.width = 256; cv.height = 256;
    const cx = cv.getContext("2d"); cx.drawImage(bmp, 0, 0);
    return cx.getImageData(0, 0, 256, 256).data;
  })().catch(() => null);

}
async function elevAt(lat, lon) {
  for (const [kind, z] of [["dem5a_png", 15], ["dem5b_png", 15], ["dem_png", 14]]) {
    const n = 2 ** z, px = (lon + 180) / 360 * n * 256;
    const ly = Math.log(Math.tan(lat * RAD) + 1 / Math.cos(lat * RAD)), py = (1 - ly / Math.PI) / 2 * n * 256;
    const tx = Math.floor(px / 256), ty = Math.floor(py / 256);

    const i = ((Math.floor(py) - ty * 256) * 256 + (Math.floor(px) - tx * 256)) * 4;
    const v = d[i] * 65536 + d[i + 1] * 256 + d[i + 2];
    if (v === 8388608) continue;            // データなし
    return (v < 8388608 ? v : v - 16777216) * 0.01;

}

    const te = Date.now();
    const h = await Promise.all(pts.map(p => elevAt(p[0], p[1])));
    addLog(`坂: 標高タイル ${demCache.size}枚・${Date.now() - te}ms・データなし ${h.filter(v => v == null).length}点`, "m");
    if (h.every(v => v == null)) throw new Error("標高データが取れませんでした");
    for (let i = 0; i < h.length; i++) if (h[i] == null) h[i] = h[i - 1] ?? h.find(v => v != null);

  const sr = simpRoute(r.route, r.kc, 1);
  return { name: r.name || "", created: r.created || Date.now(), r: encPoly(sr.pts), k: sr.kc ? encK(sr.kc) : "",
    s: r.short ? encPoly(simplify(r.short, 3)) : "", ok: encPoly(r.ok || []), xw: encPoly(r.xw || []), ng: encPoly(r.ng || []),
    len: r.len, slen: r.slen || 0, kinds: r.kinds || null, rs: r.resume || null, tn: r.turns ?? null };
}
function unpackRoute(o) {
  const route = decPoly(o.r), kc = o.k ? decK(o.k) : null;
  return { name: o.name, created: o.created, route, kc: kc && kc.length === route.length - 1 ? kc : null, short: o.s ? decPoly(o.s) : null,
    ok: decPoly(o.ok || ""), xw: decPoly(o.xw || ""), ng: decPoly(o.ng || ""), len: o.len, slen: o.slen, kinds: o.kinds, resume: o.rs || null, turns: o.tn ?? undefined };
}
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function renderList() {
  const rs = lsGet(RKEY, []);
  $("nSaved").textContent = rs.length;
  $("list").innerHTML = rs.length ? rs.slice().sort((a, b) => b.created - a.created).map(o =>
    `<div class="it" data-id="${o.id}"><div class="nm" data-a="open"><b>${esc(o.name || "名前なし")}</b>` +
    `<small>${fmtKm(o.len)}・${new Date(o.created).toLocaleDateString("ja-JP")}</small></div>` +
    `<button data-a="ren">名前</button><button data-a="del">🗑</button></div>`).join("")
    : '<div style="font-size:12px;color:#888;padding:6px">まだないよ。ルートを作って「💾 保存」してね</div>';
}
$("bList").onclick = () => { const l = $("list"); l.style.display = l.style.display === "block" ? "none" : "block"; renderList(); };
$("list").onclick = ev => {
  const a = ev.target.closest("[data-a]")?.dataset.a, it = ev.target.closest(".it"); if (!a || !it) return;
  const rs = lsGet(RKEY, []), i = rs.findIndex(o => String(o.id) === it.dataset.id); if (i < 0) return;
  if (a === "open") {
    showRoute({ ...unpackRoute(rs[i]), savedId: rs[i].id }, true);
    { const r = cur, id = rs[i].id; fixRouteName(r).then(ch => { if (!ch) return; const all = lsGet(RKEY, []), o = all.find(x => x.id === id); if (o) { o.name = r.name; lsSet(RKEY, all); renderList(); } if (cur === r) showRoute(r, false); }); }
    setMsg(`「${rs[i].name}」を開いたよ`);
    $("list").style.display = "none";
  } else if (a === "ren") {
    const n = prompt("ルートの名前", rs[i].name); if (n == null) return;
    rs[i].name = n.trim() || rs[i].name; lsSet(RKEY, rs); renderList();
  } else if (a === "del") {
    if (!confirm(`「${rs[i].name}」を消す？`)) return;
    rs.splice(i, 1); lsSet(RKEY, rs); renderList();
    if (cur && String(cur.savedId) === it.dataset.id) { cur.savedId = null; updSaveBtn(); }
  }
};
function updSaveBtn() { $("bSave").textContent = cur && cur.savedId ? "💾 保存ずみ ✓" : "💾 保存"; }
$("bSave").onclick = () => saveCur();
// ルート名をタップして名前を変える（保存ずみなら一覧の名前も変わる）
$("sum").addEventListener("click", e => {
  if (!e.target.closest("#rname") || !cur) return;
  const n = prompt("ルートの名前", cur.name || ""); if (n == null || !n.trim()) return;
  cur.name = n.trim().slice(0, 40);
  if (cur.savedId) { const rs = lsGet(RKEY, []), o = rs.find(o => o.id === cur.savedId); if (o) { o.name = cur.name; lsSet(RKEY, rs); renderList(); } }
  lsSet(LKEY, packRoute(cur)); showRoute(cur, false);
});
async function saveCur() {
  if (!cur) return false;
  await fixRouteName(cur);   // 「現在地」のままなら、保存する前に町名をさがす
  const rs = lsGet(RKEY, []);
  const old = cur.savedId ? rs.find(o => o.id === cur.savedId) : null;
  const n = prompt(old ? "名前を変えて上書き保存するよ" : "ルートの名前をつけてね", cur.name || "");
  if (n == null) return false;
  cur.name = n.trim() || cur.name || "名前なし";
  if (old) Object.assign(old, packRoute(cur), { id: old.id, created: old.created });
  else { cur.savedId = Date.now(); rs.push({ ...packRoute(cur), id: cur.savedId, created: Date.now() }); }
  if (lsSet(RKEY, rs)) { updSaveBtn(); renderList(); addLog(`💾 保存: ${cur.name}`, "ok"); return true; }
  return false;
}
renderList();

// 保存していないルートがあるときに、消す前に聞く
function unsavedRoute() { return cur && !cur.partial && !cur.savedId && cur.route && cur.route.length > 1; }
function askSave(what) {
  return new Promise(res => {
    const box = $("ask");
    box.innerHTML = `<div class="q"><b>今のルートは保存してないよ</b><br>「${esc(cur.name || "名前なし")}」（${fmtKm(cur.len || 0)}）<br>${what}前に保存する？
      <div class="btns" style="margin-top:10px"><button class="ib" data-a="save" style="border-color:#188038;color:#188038;font-weight:bold">💾 保存する</button>
      <button class="ib" data-a="skip">保存しない</button><button class="ib" data-a="cancel">やめる</button></div></div>`;
    box.style.display = "flex";
    box.onclick = e => {
      const a = e.target.dataset.a; if (!a) return;
      box.style.display = "none";
      if (a === "save") { saveCur().then(ok => res(ok ? "save" : "cancel")); return; }   // 名前入力をやめたら、なにもしない
      res(a);
    };
  });
}

if (IN_APP) $("inapp").style.display = "block";

// ---------- 開いたとき：共有URL → なければ前回のルート ----------
if (location.hash.includes("r=")) loadHash();
else {
  const last = lsGet(LKEY, null);
  if (last) { try { const lr = unpackRoute(last); showRoute(lr, true); setMsg(lr.resume ? "前回の計算が途中だったよ。「▶ 続きを計算」で再開できるよ" : "前回のルートを表示してるよ"); } catch {} }
}
</script>
</body></html>
